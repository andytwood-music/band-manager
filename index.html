    // ============================================
    // GOOGLE CALENDAR HELPER
    // ============================================
    function addToGoogleCalendar(venue, bookingDate, showtime, notes) {
      const title = `Warsaw Poland Bros @ ${venue.name}`;
      const location = venue.address || `${venue.city}, ${venue.state}`;
      
      // Format dates for Google Calendar
      let startDate, endDate;
      if (showtime) {
        // Parse showtime (e.g., "8:00 PM" or "20:00")
        const timeParts = showtime.match(/(\d+):(\d+)\s*(AM|PM)?/i);
        if (timeParts) {
          let hours = parseInt(timeParts[1]);
          const minutes = timeParts[2];
          const isPM = timeParts[3]?.toUpperCase() === 'PM';
          
          if (isPM && hours !== 12) hours += 12;
          if (!isPM && hours === 12) hours = 0;
          
          const showDate = new Date(bookingDate + 'T00:00:00');
          showDate.setHours(hours, parseInt(minutes), 0);
          
          // Format as YYYYMMDDTHHmmss
          const formatDateTime = (d) => {
            return d.getFullYear() +
              String(d.getMonth() + 1).padStart(2, '0') +
              String(d.getDate()).padStart(2, '0') +
              'T' +
              String(d.getHours()).padStart(2, '0') +
              String(d.getMinutes()).padStart(2, '0') +
              '00';
          };
          
          startDate = formatDateTime(showDate);
          const endShowDate = new Date(showDate.getTime() + 3 * 60 * 60 * 1000); // 3 hour show
          endDate = formatDateTime(endShowDate);
        } else {
          // All-day event if time parsing fails
          startDate = bookingDate.replace(/-/g, '');
          endDate = bookingDate.replace(/-/g, '');
        }
      } else {
        // All-day event
        startDate = bookingDate.replace(/-/g, '');
        endDate = bookingDate.replace(/-/g, '');
      }
      
      // Build description
      const descriptionParts = [];
      if (venue.phone) descriptionParts.push(`Phone: ${venue.phone}`);
      if (venue.email) descriptionParts.push(`Email: ${venue.email}`);
      if (venue.website) descriptionParts.push(`Website: ${venue.website}`);
      if (notes) descriptionParts.push(`Notes: ${notes}`);
      if (venue.notes) descriptionParts.push(`Venue Notes: ${venue.notes}`);
      const description = descriptionParts.join('%0A'); // URL-encoded newline
      
      // Build Google Calendar URL
      const params = new URLSearchParams({
        action: 'TEMPLATE',
        text: title,
        dates: `${startDate}/${endDate}`,
        location: location
      });
      
      // Add description separately to avoid double-encoding
      const url = `https://calendar.google.com/calendar/render?${params.toString()}&details=${description}`;
      window.open(url, '_blank');
    }

      async function loadData() {
        if (!db) {
          alert('Firebase not configured. Please add your Firebase config.');
          setLoading(false);
          return;
        }

        try {
          // Load available dates
          const availsDoc = await db.collection('config').doc('availableDates').get();
          if (availsDoc.exists) {
            setSavedAvailableDates(availsDoc.data().dates || '');
          }

          // Load venues with real-time updates
          db.collection('venues').onSnapshot(snapshot => {
            const venuesData = snapshot.docs.map(doc => ({
              id: doc.id,
              ...doc.data(),
              playHistory: doc.data().playHistory || []
            }));
            
            // Auto-migrate past bookings to playHistory
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            venuesData.forEach(async (venue) => {
              if (!venue.bookings || venue.bookings.length === 0) return;
              
              const futureBookings = [];
              const pastBookings = venue.playHistory || [];
              let needsUpdate = false;
              
              venue.bookings.forEach(booking => {
                const bookingDate = new Date(booking.date + 'T00:00:00');
                if (bookingDate < today) {
                  // Move to play history
                  pastBookings.push({
                    date: booking.date,
                    showtime: booking.showtime || '',
                    notes: booking.notes || '',
                    status: booking.status || 'Confirmed'
                  });
                  needsUpdate = true;
                } else {
                  futureBookings.push(booking);
                }
              });
              
              if (needsUpdate) {
                // Sort play history by date (most recent first)
                pastBookings.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                const updates = {
                  bookings: futureBookings,
                  playHistory: pastBookings,
                  mostRecentlyPlayed: pastBookings.length > 0 ? pastBookings[0].date : venue.mostRecentlyPlayed
                };
                
                // Update status to 'Played' if no future bookings
                if (futureBookings.length === 0 && pastBookings.length > 0) {
                  updates.status = 'Played';
                }
                
                try {
                  await db.collection('venues').doc(venue.id).update(updates);
                } catch (error) {
                  console.error('Error migrating bookings for', venue.name, error);
                }
              }
            });
            
            setVenues(venuesData);
            setLoading(false);
          });

          setLoading(false);
        }

      // Auto-fill missing venue info using Google Places API (New)
      async function autoFillMissingInfo() {
        if (!db) return;
        
        const venuesToFill = venues.filter(v => 
          v.city && v.state && (!v.address || !v.phone || !v.website)
        );

        if (venuesToFill.length === 0) {
          alert('All venues already have complete information!');
          return;
        }

        if (!window.confirm(`This will search Google Places for ${venuesToFill.length} venues and auto-fill missing info.\n\nNote: This uses your Google API quota. Continue?`)) {
          return;
        }

        let processed = 0;
        let updated = 0;
        let failed = 0;
        const results = [];

        for (const venue of venuesToFill) {
          processed++;
          
          try {
            // Use Text Search (New) API
            const searchQuery = encodeURIComponent(`${venue.name}, ${venue.city}, ${venue.state}`);
            const searchUrl = `https://places.googleapis.com/v1/places:searchText`;
            
            const searchResponse = await fetch(searchUrl, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-Goog-Api-Key': GOOGLE_MAPS_API_KEY,
                'X-Goog-FieldMask': 'places.displayName,places.formattedAddress,places.nationalPhoneNumber,places.websiteUri,places.location'
              },
              body: JSON.stringify({
                textQuery: `${venue.name}, ${venue.city}, ${venue.state}`
              })
            });

            const searchData = await searchResponse.json();

            if (searchData.places && searchData.places.length > 0) {
              const place = searchData.places[0];
              const updates = {};

              if (!venue.address && place.formattedAddress) {
                updates.address = place.formattedAddress;
              }
              if (!venue.phone && place.nationalPhoneNumber) {
                updates.phone = place.nationalPhoneNumber;
              }
              if (!venue.website && place.websiteUri) {
                updates.website = place.websiteUri;
              }
              if (place.location) {
                updates.latitude = place.location.latitude;
                updates.longitude = place.location.longitude;
              }

              if (Object.keys(updates).length > 0) {
                await db.collection('venues').doc(venue.id).update(updates);
                updated++;
                results.push(`✓ ${venue.name}: ${Object.keys(updates).join(', ')}`);
              } else {
                results.push(`- ${venue.name}: No missing info found`);
              }
            } else {
              failed++;
              results.push(`✗ ${venue.name}: Not found in Google Places`);
            }

          } catch (error) {
            failed++;
            console.error(`Error processing ${venue.name}:`, error);
            results.push(`✗ ${venue.name}: Error - ${error.message}`);
          }

          // Update progress
          if (processed % 10 === 0 || processed === venuesToFill.length) {
            console.log(`Progress: ${processed}/${venuesToFill.length} - Updated: ${updated}, Failed: ${failed}`);
          }

          // Rate limit
          await new Promise(resolve => setTimeout(resolve, 200));
        }

        alert(`Auto-fill complete!\n\nProcessed: ${processed}\nUpdated: ${updated}\nFailed: ${failed}\n\nCheck console for details.`);
        console.log('=== AUTO-FILL RESULTS ===');
        results.forEach(r => console.log(r));

    function VenueMap({ venues, onClose, onSelectVenue, initialCenter, initialZoom, initialRegionFilter, onMapStateChange }) {
      const mapRef = React.useRef(null);
      const mapInstanceRef = React.useRef(null);
      const markersRef = React.useRef([]);
      const hasInitializedBounds = React.useRef(false);
      const [mapLoaded, setMapLoaded] = React.useState(false);
      const [geocoding, setGeocoding] = React.useState(false);
      const [geocodedCount, setGeocodedCount] = React.useState(0);
      const [filterRegion, setFilterRegion] = React.useState(initialRegionFilter || 'All');
      const [visibleStatuses, setVisibleStatuses] = React.useState({
        'Not Contacted': true,
        'Waiting': true,
        'Priority': true,
        'Booked': true,
        'Tentative': true,
        'Played': true,
        'Passed': true,
        'Closed': true
      });

      const statusColors = {
        'Not Contacted': '#9CA3AF',
        'Waiting': '#EAB308',
        'Priority': '#F97316',
        'Tentative': '#F59E0B',
        'Booked': '#10B981',
        'Played': '#3B82F6',
        'Passed': '#EF4444',
        'Closed': '#6B7280'
      };

      // Load Google Maps script
      React.useEffect(() => {
        if (window.google && window.google.maps) {
          setMapLoaded(true);
          return;
        }

        if (GOOGLE_MAPS_API_KEY === "YOUR_GOOGLE_MAPS_API_KEY_HERE") {
          alert("Please add your Google Maps API key to the HTML file!");
          return;
        }

        const script = document.createElement('script');
        script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&libraries=geometry,places`;
        script.async = true;
        script.defer = true;
        script.onload = () => setMapLoaded(true);
        script.onerror = () => alert("Failed to load Google Maps");
        document.head.appendChild(script);
      }, []);

      // Initialize map and add markers
      React.useEffect(() => {
        if (!mapLoaded || !mapRef.current) return;

        // Create map only once
        if (!mapInstanceRef.current) {
          mapInstanceRef.current = new google.maps.Map(mapRef.current, {
            center: initialCenter || { lat: 33.8, lng: -116.5 },
            zoom: initialZoom || 8,
            styles: []
          });
          
          // If we have initial position, mark as initialized to prevent auto-zoom
          if (initialCenter && initialZoom) {
            hasInitializedBounds.current = true;
          }
          
          // Save map state when user pans or zooms
          if (onMapStateChange) {
            mapInstanceRef.current.addListener('idle', () => {
              const center = mapInstanceRef.current.getCenter();
              const zoom = mapInstanceRef.current.getZoom();
              if (center) {
                onMapStateChange(
                  { lat: center.lat(), lng: center.lng() },
                  zoom,
                  filterRegion
                );
              }
            });
          }
        }

        const map = mapInstanceRef.current;
        const bounds = new google.maps.LatLngBounds();
        let markerCount = 0;

        // Clear old markers
        markersRef.current.forEach(m => m.setMap(null));
        markersRef.current = [];

        // Add markers for venues with coordinates and visible status and region
        venues.forEach(venue => {
          const matchesRegion = filterRegion === 'All' || venue.region === filterRegion;
          if (venue.latitude && venue.longitude && visibleStatuses[venue.status] && matchesRegion) {
            const position = { lat: venue.latitude, lng: venue.longitude };
            
            const marker = new google.maps.Marker({
              position: position,
              map: map,
              title: venue.name,
              icon: {
                path: google.maps.SymbolPath.CIRCLE,
                scale: 8,
                fillColor: statusColors[venue.status] || '#9CA3AF',
                fillOpacity: 0.9,
                strokeColor: '#FFFFFF',
                strokeWeight: 2
              }
            });

            markersRef.current.push(marker);

            const infoWindow = new google.maps.InfoWindow({
              content: `
                <div style="padding: 8px; max-width: 250px;">
                  <h3 style="margin: 0 0 4px 0; font-weight: bold; font-size: 14px;">${venue.name}</h3>
                  <p style="margin: 0 0 4px 0; color: #666; font-size: 12px;">${venue.city}, ${venue.state}</p>
                  <p style="margin: 0 0 8px 0; color: #666; font-size: 12px;">Status: ${venue.status}</p>
                  ${(() => {
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);
                    let bookingsHTML = '';
                    
                    if (venue.bookings && venue.bookings.length > 0) {
                      const futureBookings = venue.bookings
                        .filter(b => new Date(b.date + 'T00:00:00') >= today)
                        .sort((a, b) => new Date(a.date) - new Date(b.date));
                      
                      if (futureBookings.length > 0) {
                        bookingsHTML = '<div style="margin-bottom: 8px; padding-top: 8px; border-top: 1px solid #ddd;">';
                        bookingsHTML += '<p style="margin: 0 0 4px 0; font-weight: 600; font-size: 11px; color: #888;">UPCOMING BOOKINGS:</p>';
                        futureBookings.forEach(booking => {
                          const date = new Date(booking.date + 'T00:00:00');
                          const dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                          const statusColor = booking.status === 'Confirmed' ? '#10B981' : '#F59E0B';
                          const statusText = booking.status || 'Confirmed';
                          bookingsHTML += '<p style="margin: 2px 0; font-size: 11px; color: #333;">📅 ' + dateStr + ' <span style="color: ' + statusColor + '; font-weight: 600;">' + statusText + '</span></p>';
                        });
                        bookingsHTML += '</div>';
                      }
                    } else if (venue.confirmedBookingDate) {
                      const bookingDate = new Date(venue.confirmedBookingDate + 'T00:00:00');
                      if (bookingDate >= today) {
                        const dateStr = bookingDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                        bookingsHTML = '<div style="margin-bottom: 8px; padding-top: 8px; border-top: 1px solid #ddd;">';
                        bookingsHTML += '<p style="margin: 0 0 4px 0; font-weight: 600; font-size: 11px; color: #888;">UPCOMING BOOKING:</p>';
                        bookingsHTML += '<p style="margin: 2px 0; font-size: 11px; color: #10B981; font-weight: 600;">📅 ' + dateStr + '</p>';
                        bookingsHTML += '</div>';
                      }
                    }
                    
                    return bookingsHTML;
                  })()}
                  <button 
                    onclick="window.selectVenueFromMap('${venue.id}')"
                    style="background: #8B5CF6; color: white; padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;"
                  >View Details</button>
                </div>
              `
            });

            marker.addListener('click', () => {
              infoWindow.open(map, marker);
            });

            markersRef.current.push(marker);
            bounds.extend(position);
            markerCount++;
          }
        });

        // Fit map to show all markers
        // - On first load: auto-zoom to all venues
        // - When region filter changes: auto-zoom to filtered venues
        // - Otherwise: preserve user's zoom/pan
        if (markerCount > 0 && (!hasInitializedBounds.current || filterRegion !== 'All')) {
          map.fitBounds(bounds);
          if (!hasInitializedBounds.current) {
            hasInitializedBounds.current = true;
          }
        }

        // Global function for info window button
        window.selectVenueFromMap = (venueId) => {
          const venue = venues.find(v => v.id === venueId);
          if (venue) onSelectVenue(venue);
        };

      }, [mapLoaded, venues, visibleStatuses, filterRegion]);

      // Save map state (center, zoom, region filter) whenever they change
      React.useEffect(() => {
        if (mapInstanceRef.current && onMapStateChange) {
          const center = mapInstanceRef.current.getCenter();
          const zoom = mapInstanceRef.current.getZoom();
          if (center) {
            onMapStateChange(
              { lat: center.lat(), lng: center.lng() },
              zoom,
              filterRegion
            );
          }
        }
      }, [filterRegion]);

      // Geocode venues without coordinates
      async function geocodeVenues() {
        if (!db) return;
        console.log('Starting geocoding...');
        setGeocoding(true);
        setGeocodedCount(0);

        const venuesToGeocode = venues.filter(v => v.address && !v.latitude && !v.geocodeFailed);
        
        if (venuesToGeocode.length === 0) {
          alert('No venues need geocoding! All venues with addresses have been geocoded.');
          setGeocoding(false);
          return;
        }
        
        console.log(`Found ${venuesToGeocode.length} venues to geocode`);
        console.log('Venues to geocode:', venuesToGeocode.map(v => v.name));
        
        let successCount = 0;
        let failCount = 0;
        
        for (let i = 0; i < venuesToGeocode.length; i++) {
          const venue = venuesToGeocode[i];
          console.log(`Geocoding ${i + 1}/${venuesToGeocode.length}: ${venue.name}`);
          console.log(`Address: ${venue.address}`);
          
          try {
            // If address already contains city/state/zip, just use it. Otherwise append city/state.
            let fullAddress = venue.address;
            if (!fullAddress.includes(venue.state)) {
              fullAddress = `${venue.address}, ${venue.city}, ${venue.state}`;
            }
            
            const url = `https://maps.googleapis.com/maps/api/geocode/json?address=${encodeURIComponent(fullAddress)}&key=${GOOGLE_MAPS_API_KEY}`;
            const response = await fetch(url);
            const data = await response.json();
            
            if (data.results && data.results[0]) {
              const location = data.results[0].geometry.location;
              console.log(`✓ ${venue.name}: Got coordinates:`, location);
              await db.collection('venues').doc(venue.id).update({
                latitude: location.lat,
                longitude: location.lng
              });
              successCount++;
              setGeocodedCount(i + 1);
            } else {
              console.error(`✗ ${venue.name}: No results. Status:`, data.status);
              // Mark as failed so we don't keep trying
              await db.collection('venues').doc(venue.id).update({
                geocodeFailed: true,
                geocodeFailReason: data.status || 'No results'
              });
              failCount++;
            }
            
            // Rate limit
            await new Promise(resolve => setTimeout(resolve, 1000));
          } catch (error) {
            console.error(`✗ ${venue.name}: Error:`, error);
            failCount++;
          }
        }

        setGeocoding(false);
        
        // Show detailed failure info
        let message = `Success: ${successCount} | Failed: ${failCount}`;
        
        if (failCount > 0) {
          // Get the first few failed venues to show error details
          const failedVenues = venues.filter(v => v.geocodeFailed).slice(0, 5);
          message += '\n\nErrors:';
          failedVenues.forEach(v => {
            message += `\n${v.name}: ${v.geocodeFailReason || 'Unknown'}`;
          });
        }
        
        alert(message);
      }

      async function retryFailedGeocoding() {
        if (!db) return;
        
        const failedVenues = venues.filter(v => v.geocodeFailed);
        
        if (failedVenues.length === 0) {
          alert('No failed venues to retry!');
          return;
        }
        
        if (!confirm(`Retry geocoding for ${failedVenues.length} failed venues?`)) {
          return;
        }
        
        // Clear the geocodeFailed flag on all failed venues
        for (const venue of failedVenues) {
          try {
            await db.collection('venues').doc(venue.id).update({
              geocodeFailed: false,
              geocodeFailReason: null
            });
          } catch (error) {
            console.error(`Error clearing failed flag for ${venue.name}:`, error);
          }
        }
        
        alert(`Cleared failed status for ${failedVenues.length} venues. Click "Geocode Missing Venues" to try again.`);
      }

      const venuesWithCoords = venues.filter(v => v.latitude && v.longitude).length;
      const venuesWithAddresses = venues.filter(v => v.address).length;
      const needsGeocoding = venues.filter(v => v.address && !v.latitude && !v.geocodeFailed).length;

            },

              )
            ),
            needsGeocoding > 0 && React.createElement('button', {
              onClick: geocodeVenues,
              disabled: geocoding,
              className: 'px-4 py-2 bg-blue-500 text-white rounded-lg font-medium hover:bg-blue-600 disabled:opacity-50'
            }, geocoding ? `Geocoding... ${geocodedCount}/${needsGeocoding}` : `Geocode ${needsGeocoding} venues`),
            React.createElement('button', {

        }),

        // Legend with status filters
        React.createElement('div', {

        },
          React.createElement('div', {

          }, Object.entries(statusColors).map(([status, color]) =>

    // ============================================
    // VENUE VIEW COMPONENT
    // ============================================
    function VenueView({ venue, onClose, onEdit, onEmail, onStatusChange }) {
      async function changeStatus(newStatus) {
        if (!db) return;
        
        // If changing from Booked to Played, prompt for pay and merch
        if (venue.status === 'Booked' && newStatus === 'Played') {
          const pay = prompt('How much did they pay? (just the number, e.g. 500)');
          const merch = prompt('Merch sales? (just the number, e.g. 180)');
          
          const updates = { 
            status: newStatus,
            mostRecentlyPlayed: venue.confirmedBookingDate || new Date().toISOString().split('T')[0]
          };
          
          if (pay && !isNaN(pay)) {
            updates.lastPay = parseInt(pay);
            updates.lastPayDate = venue.confirmedBookingDate || new Date().toISOString().split('T')[0];
          }
          
          if (merch && !isNaN(merch)) {
            updates.merchSales = parseInt(merch);
            updates.merchSalesDate = venue.confirmedBookingDate || new Date().toISOString().split('T')[0];
          }
          
          try {
            await db.collection('venues').doc(venue.id).update(updates);
            if (onStatusChange) onStatusChange(newStatus);
          } catch (error) {
            console.error('Error updating status:', error);
            alert('Error updating status');
          }
        } else {
          // Normal status change
          try {
            await db.collection('venues').doc(venue.id).update({ status: newStatus });
            if (onStatusChange) onStatusChange(newStatus);
          } catch (error) {
            console.error('Error updating status:', error);
            alert('Error updating status');
          }
        }
      }

      return React.createElement('div', {
        className: 'min-h-screen p-4'
      },

          },

              className: 'text-2xl font-bold text-gray-900'
            }, venue.name),

            }, 'Status:'),

            }, ['Not Contacted', 'Waiting', 'Priority', 'Tentative', 'Booked', 'Played', 'Passed', 'Closed'].map(status =>

    function PhotoUpload({ onVenueParsed, onCancel }) {
      const [uploading, setUploading] = React.useState(false);
      const [processing, setProcessing] = React.useState(false);
      const [progress, setProgress] = React.useState(0);
      const [extractedText, setExtractedText] = React.useState('');
      const [parsedVenue, setParsedVenue] = React.useState(null);
      const fileInputRef = React.useRef(null);

      async function handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        setUploading(true);
        setProcessing(true);
        setProgress(0);

        try {
          const { data: { text } } = await Tesseract.recognize(
            file,
            'eng',
            {
              logger: m => {
                if (m.status === 'recognizing text') {
                  setProgress(Math.round(m.progress * 100));
                }
              }
            }
          );

          setExtractedText(text);
          const venue = parseVenueFromText(text);
          setParsedVenue(venue);
          setProcessing(false);
        } catch (error) {
          console.error('OCR Error:', error);
          alert('Error processing image. Please try again.');
          setProcessing(false);
          setUploading(false);
        }
      }

      function parseVenueFromText(text) {
        const lines = text.split('\n').filter(line => line.trim());
        const venue = {
          name: '',
          address: '',
          city: '',
          state: '',
          phone: '',
          website: ''
        };

        // Clean up text - remove common OCR artifacts
        const cleanText = text.replace(/[|]/g, 'I').replace(/\s+/g, ' ');

        // === VENUE NAME EXTRACTION ===
        // Strategy 1: Google Maps screenshot detection
        // Look for the tab row ("Overview Tickets Reviews Photos") as a landmark
        const tabKeywords = /overview|tickets|reviews|photos|products/gi;
        let tabRowIndex = -1;
        
        for (let i = 0; i < lines.length; i++) {
          const matches = lines[i].match(tabKeywords);
          if (matches && matches.length >= 2) {
            tabRowIndex = i;
            break;
          }
        }
        
        if (tabRowIndex > 0) {
          // Venue name is on the line(s) before the tab row
          let nameLine = '';
          for (let i = tabRowIndex - 1; i >= 0; i--) {
            const candidate = lines[i].trim();
            if (candidate.length <= 2) continue;
            if (/^[\d\s\-\(\)\.\,\@\#\$\%\&\*]+$/.test(candidate)) continue;
            nameLine = candidate;
            break;
          }
          
          if (nameLine) {
            // Clean OCR artifacts from icons/buttons on same line as name
            let cleaned = nameLine;
            cleaned = cleaned
              .replace(/^[^A-Za-z0-9]+/, '')                 // leading symbols
              .replace(/^([a-z])\s+(?=[A-Z0-9])/g, '')       // single lowercase + space before capital/digit
              .replace(/^(\d)\s+(?=[A-Z])/g, '')              // single digit + space before capital (misread icon)
              .trim();
            
            // Trim trailing junk
            cleaned = cleaned
              .replace(/[^A-Za-z0-9''\-&\.]+$/, '')  // trailing symbols
              .replace(/\s+[a-z]{1,2}$/, '')           // trailing 1-2 lowercase chars
              .trim();
            
            if (cleaned.length > 2) {
              venue.name = cleaned;
            }
          }
        }
        
        // Strategy 2: Fallback for non-Google-Maps screenshots
        if (!venue.name) {
          const skipWords = /^(overview|menu|reviews|photos|updates|open|closed|know|before|you|go|new|ask|question|saved|starred|places|by|summarized|with|ai)/i;
          for (let i = 0; i < Math.min(5, lines.length); i++) {
            const line = lines[i].trim();
            if (line.length > 3 && 
                !line.match(/^\d/) && 
                !line.match(/^http/i) &&
                !skipWords.test(line) &&
                !line.match(/^[\d\s\-\(\)]+$/) &&
                line.length < 60) {
              venue.name = line.replace(/\s+/g, ' ').trim();
              break;
            }
          }
        }

        // Find phone number (multiple formats)
        const phoneRegex = /(\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4})/;
        const phoneMatch = cleanText.match(phoneRegex);
        if (phoneMatch) {
          venue.phone = phoneMatch[1];
        }

        // Find website - more flexible matching
        const websiteRegex = /(https?:\/\/[^\s]+|(?:www\.)?[a-z0-9-]+\.(?:com|net|org|co|us|ca|uk|au|io|space)(?:\/[^\s]*)?)/i;
        const websiteMatch = cleanText.match(websiteRegex);
        if (websiteMatch) {
          let site = websiteMatch[1].replace(/[,\s]+$/, '');
          if (!site.startsWith('http')) {
            site = 'https://' + site;
          }
          venue.website = site;
        }

        // Find full address with better pattern matching
        const fullAddressRegex = /(\d+\s+(?:[NSEW]\s+)?(?:Rte|Route|Highway|Hwy|[A-Za-z0-9]+(?:\s+[A-Za-z0-9]+)*?)(?:\s+(?:Street|St|Avenue|Ave|Road|Rd|Drive|Dr|Lane|Ln|Boulevard|Blvd|Way|Court|Ct|Place|Pl|Circle|Cir|Parkway|Pkwy|Route|Rte))?)[\s,]+([A-Z][a-z]+(?:\s+[A-Z][a-z]+)*)[\s,]+([A-Z]{2})[\s,]+(\d{5})/i;
        const fullAddressMatch = cleanText.match(fullAddressRegex);
        
        if (fullAddressMatch) {
          const street = fullAddressMatch[1].trim();
          const city = fullAddressMatch[2].trim();
          const state = fullAddressMatch[3].toUpperCase();
          const zip = fullAddressMatch[4];
          
          venue.address = `${street}, ${city}, ${state} ${zip}`;
          venue.city = city;
          venue.state = state;
        } else {
          const cityStateZipRegex = /([A-Z][a-z]+(?:\s+[A-Z][a-z]+)*)[\s,]+([A-Z]{2})[\s,]+(\d{5})/;
          const cityStateZipMatch = cleanText.match(cityStateZipRegex);
          
          if (cityStateZipMatch) {
            venue.city = cityStateZipMatch[1].trim();
            venue.state = cityStateZipMatch[2].toUpperCase();
            
            const streetBeforeCityRegex = new RegExp(`(\\d+\\s+[^\\n,]+?)(?=[,\\s]*${venue.city})`, 'i');
            const streetMatch = cleanText.match(streetBeforeCityRegex);
            if (streetMatch) {
              venue.address = `${streetMatch[1].trim()}, ${venue.city}, ${venue.state} ${cityStateZipMatch[3]}`;
            } else {
              venue.address = `${venue.city}, ${venue.state} ${cityStateZipMatch[3]}`;
            }
          } else {
            const cityStateRegex = /([A-Z][a-z]+(?:\s+[A-Z][a-z]+)*)[\s,]+([A-Z]{2})(?:\s|$)/;
            const cityStateMatch = cleanText.match(cityStateRegex);
            if (cityStateMatch) {
              venue.city = cityStateMatch[1].trim();
              venue.state = cityStateMatch[2].toUpperCase();
            }
          }
        }

        // Final cleanup on venue name (for fallback strategy only)
        if (venue.name && tabRowIndex < 0) {
          venue.name = venue.name
            .replace(/^["']/, '')
            .replace(/["']$/, '')
            .replace(/\s+/g, ' ')
            .replace(/([a-z])([A-Z])/g, '$1 $2')
            .replace(/\s+(th|st|nd|rd)\s+[A-Z]\s*[|].*$/i, '')
            .replace(/\s+[|].*$/, '')
            .replace(/\s+[XxØø]\s*$/, '')
            .trim();
        }

        return venue;
      }

      function handleAddVenue() {
        if (parsedVenue) {
          onVenueParsed(parsedVenue);
        }
      }

      return React.createElement('div', {
        className: 'min-h-screen p-4'
      },
        React.createElement('div', {
          className: 'bg-white rounded-2xl shadow-xl p-6 max-w-2xl mx-auto'
        },
          React.createElement('div', {
            className: 'flex items-center justify-between mb-6'
          },
            React.createElement('h2', {
              className: 'text-2xl font-bold text-gray-900'
            }, '📸 Add Venue from Photo'),
            React.createElement('button', {
              onClick: onCancel,
              className: 'text-gray-500 hover:text-gray-700'
            }, React.createElement(Icon, { name: 'X', size: 24 }))
          ),

          React.createElement('div', {
            className: 'space-y-4'
          },
            React.createElement('p', {
              className: 'text-gray-600'
            }, 'Take a photo or upload a screenshot of venue info (like from Google Maps) and we\'ll automatically extract the details!'),

            React.createElement('input', {
              ref: fileInputRef,
              type: 'file',
              accept: 'image/*',
              onChange: handleFileUpload,
              className: 'hidden'
            }),

            !uploading && React.createElement('button', {
              onClick: () => fileInputRef.current.click(),
              className: 'w-full py-4 bg-gradient-to-r from-orange-500 to-pink-500 text-white rounded-xl font-bold text-lg hover:from-orange-600 hover:to-pink-600 transition-colors'
            }, '📸 Choose Photo'),

            processing && React.createElement('div', {
              className: 'space-y-2'
            },
              React.createElement('p', {
                className: 'text-center text-gray-700 font-medium'
              }, 'Processing image... ' + progress + '%'),
              React.createElement('div', {
                className: 'w-full bg-gray-200 rounded-full h-3'
              },
                React.createElement('div', {
                  className: 'bg-gradient-to-r from-orange-500 to-pink-500 h-3 rounded-full transition-all',
                  style: { width: progress + '%' }
                })
              )
            ),

            parsedVenue && React.createElement('div', {
              className: 'space-y-4'
            },
              React.createElement('div', {
                className: 'bg-green-50 border-2 border-green-200 rounded-xl p-4'
              },
                React.createElement('h3', {
                  className: 'font-bold text-green-800 mb-3'
                }, '✓ Venue Detected!'),
                React.createElement('div', {
                  className: 'space-y-2 text-sm'
                },
                  parsedVenue.name && React.createElement('p', null,
                    React.createElement('span', { className: 'font-semibold' }, 'Name: '),
                    parsedVenue.name
                  ),
                  parsedVenue.address && React.createElement('p', null,
                    React.createElement('span', { className: 'font-semibold' }, 'Address: '),
                    parsedVenue.address
                  ),
                  parsedVenue.city && React.createElement('p', null,
                    React.createElement('span', { className: 'font-semibold' }, 'City: '),
                    parsedVenue.city + (parsedVenue.state ? ', ' + parsedVenue.state : '')
                  ),
                  parsedVenue.phone && React.createElement('p', null,
                    React.createElement('span', { className: 'font-semibold' }, 'Phone: '),
                    parsedVenue.phone
                  ),
                  parsedVenue.website && React.createElement('p', null,
                    React.createElement('span', { className: 'font-semibold' }, 'Website: '),
                    parsedVenue.website
                  )
                )
              ),

              React.createElement('div', {
                className: 'bg-blue-50 border-2 border-blue-200 rounded-xl p-4'
              },
                React.createElement('p', {
                  className: 'text-sm text-blue-800 font-medium mb-2'
                }, 'Raw text extracted:'),
                React.createElement('pre', {
                  className: 'text-xs text-gray-700 whitespace-pre-wrap max-h-32 overflow-y-auto'
                }, extractedText)
              ),

              React.createElement('div', {
                className: 'flex gap-3'
              },
                React.createElement('button', {
                  onClick: onCancel,
                  className: 'flex-1 py-3 bg-gray-200 text-gray-700 rounded-xl font-bold hover:bg-gray-300'
                }, 'Cancel'),
                React.createElement('button', {
                  onClick: handleAddVenue,
                  className: 'flex-1 py-3 bg-gradient-to-r from-green-500 to-emerald-500 text-white rounded-xl font-bold hover:from-green-600 hover:to-emerald-600'
                }, 'Add Venue')
              )
            )
          )
        )
      );
    }

    // ============================================
    // BULK IMPORT COMPONENT
    // ============================================
    function BulkImport({ onImport, onCancel }) {
      const [pastedData, setPastedData] = React.useState('');
      const [preview, setPreview] = React.useState([]);

      function parseData() {
        if (!pastedData.trim()) {
          alert('Please paste some data first');
          return;
        }

        // Parse with PapaParse (handles quotes, line breaks, etc.)
        const result = Papa.parse(pastedData, {
          delimiter: '\t',
          header: true,
          skipEmptyLines: true,
          quoteChar: '"',
          escapeChar: '"'
        });

        if (result.errors.length > 0) {
          console.error('Parse errors:', result.errors);
          alert('Error parsing data. Check console for details.');
          return;
        }

        // Validate headers
        const expectedHeaders = [
          'Name', 'City', 'State', 'Phone', 'Email', 'Website', 'Address',
          'Region', 'Category', 'Status', 'Played Before', 'Most Recent Booking',
          'Future Bookings', 'Booking Window Opens', 'Typical Pay', 'Last Pay',
          'Last Pay Date', 'Merch Sales', 'Merch Sales Date', 'Notes',
          'Latitude', 'Longitude'
        ];

        const actualHeaders = Object.keys(result.data[0] || {});
        const missingHeaders = expectedHeaders.filter(h => !actualHeaders.includes(h));
        
        if (missingHeaders.length > 0) {
          alert(`ERROR: Missing required headers:\n${missingHeaders.join(', ')}\n\nExpected headers:\n${expectedHeaders.join(', ')}\n\nMake sure you're using the latest export format!`);
          return;
        }

        // Convert parsed data to venue objects
        const venues = result.data.map(row => {
          const city = row.City || '';
          const region = row.Region || getRegionForCity(city);
          
          return {
            name: row.Name || '',
            city: city,
            state: row.State || '',
            phone: row.Phone || '',
            email: row.Email || '',
            website: row.Website || '',
            address: row.Address || '',
            region: region,
            category: row.Category || '',
            status: row.Status || 'Not Contacted',
            playedBefore: row['Played Before']?.toLowerCase() === 'yes',
            mostRecentlyPlayed: row['Most Recent Booking'] || null,
            bookings: row['Future Bookings'] ? JSON.parse(row['Future Bookings']) : [],
            bookingWindowDate: row['Booking Window Opens'] || '',
            typicalPay: row['Typical Pay'] || '',
            lastPay: row['Last Pay'] ? parseInt(row['Last Pay']) : null,
            lastPayDate: row['Last Pay Date'] || null,
            merchSales: row['Merch Sales'] ? parseInt(row['Merch Sales']) : null,
            merchSalesDate: row['Merch Sales Date'] || null,
            notes: row.Notes || '',
            latitude: row.Latitude ? parseFloat(row.Latitude) : null,
            longitude: row.Longitude ? parseFloat(row.Longitude) : null,
            lastContacted: null,
            emailHistory: []
          };
        }).filter(v => v.name && v.city); // Only keep rows with name and city
        
        setPreview(venues);
      }

      return React.createElement('div', {
        className: 'min-h-screen p-4'
      },
        React.createElement('div', {
          className: 'bg-white rounded-2xl shadow-xl p-6 max-w-4xl mx-auto'
        },
          React.createElement('div', {
            className: 'flex items-center justify-between mb-6'
          },
            React.createElement('h2', {
              className: 'text-2xl font-bold text-gray-900'
            }, 'Bulk Import Venues'),
            React.createElement('button', {
              onClick: onCancel,
              className: 'p-2 hover:bg-gray-100 rounded-lg'
            }, React.createElement(Icon, { name: 'X', size: 24 }))
          ),

          React.createElement('div', {
            className: 'mb-6'
          },
            React.createElement('p', {
              className: 'text-gray-600 mb-4'
            }, 'Paste your TSV data from Excel (must include header row). Use the Download button to get the current data format, edit it in Excel, and paste it back here. Headers will be validated automatically.'),
            React.createElement('textarea', {
              value: pastedData,
              onChange: (e) => setPastedData(e.target.value),
              rows: 10,
              className: 'w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm font-mono focus:outline-none focus:border-purple-500',
              placeholder: 'Paste your Excel data here (include header row)...'
            })
          ),

          React.createElement('div', {
            className: 'flex gap-3 mb-6'
          },
            React.createElement('button', {
              onClick: parseData,
              className: 'flex-1 bg-blue-500 text-white py-3 rounded-xl font-bold text-lg'
            }, 'Preview Import')
          ),

          preview.length > 0 && React.createElement(React.Fragment, null,
            React.createElement('div', {
              className: 'bg-green-50 border-2 border-green-200 rounded-xl p-4 mb-4'
            },
              React.createElement('p', {
                className: 'text-green-800 font-semibold'
              }, '✓ Found ' + preview.length + ' venues to import')
            ),

            React.createElement('div', {
              className: 'max-h-96 overflow-y-auto mb-6 space-y-2'
            },
              preview.slice(0, 10).map((venue, idx) =>
                React.createElement('div', {
                  key: idx,
                  className: 'bg-gray-50 p-3 rounded-lg'
                },
                  React.createElement('p', {
                    className: 'font-semibold'
                  }, venue.name),
                  React.createElement('p', {
                    className: 'text-sm text-gray-600'
                  }, venue.city + ', ' + venue.state)
                )
              ),
              preview.length > 10 && React.createElement('p', {
                className: 'text-center text-gray-500'
              }, '...and ' + (preview.length - 10) + ' more')
            ),

            React.createElement('button', {
              onClick: () => onImport(preview),
              className: 'w-full bg-gradient-to-r from-green-500 to-emerald-500 text-white py-4 rounded-xl font-bold text-lg'
            }, 'Import ' + preview.length + ' Venues')
          )
        )
      );
    }

    // ============================================
    // RENDER APP
    // ============================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
