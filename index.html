<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Band Manager</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { Music, MapPin, Mail, Phone, Search, Filter, Plus, Edit, Trash2, Settings, Upload, Copy, Check, X } = lucide;

    const SAMPLE_VENUES = [
      { id: '1', name: 'Ivy Room', city: 'Albany', state: 'CA', phone: '(510) 526-5888', email: 'booking@ivyroom.com', address: '1 (510) 526-5888', notes: 'Berkeley area', status: 'Not Contacted', lastContacted: null, emailHistory: [] },
      { id: '2', name: 'Humbrews', city: 'Arcata', state: 'CA', phone: '(707) 826-2739', email: '', address: '856 10th St, Arcata, CA 95521', notes: 'no email call only', status: 'Not Contacted', lastContacted: null, emailHistory: [] },
      { id: '3', name: "O'Leary's Pub", city: 'Bullhead City', state: 'CA', phone: '(928) 754 4226', email: 'davedahdah@gmail.com', address: '1063 AZ-95, Bullhead City, AZ 86429', notes: '', status: 'Not Contacted', lastContacted: null, emailHistory: [] },
      { id: '4', name: 'Bear Claw Saloon', city: 'Crestline', state: 'CA', phone: '(909) 338-3951', email: '', address: '24087 Lake Dr, Crestline, CA 92325', notes: '', status: 'Not Contacted', lastContacted: null, emailHistory: [] },
      { id: '5', name: 'Ska Brewing', city: 'Durango', state: 'CO', phone: '(970) 247-5792', email: 'maggiek@skabrewing.com', address: '225 Girard St, Durango, CO 81303', notes: '', status: 'Booked', lastContacted: '2025-11-08', emailHistory: [] },
      { id: '6', name: '1st Street Bar', city: 'Encinitas', state: 'CA', phone: '(760) 944-0233', email: 'idropsoundco@gmail.com', address: '656 South Coast Hwy 101, Encinitas, CA', notes: '', status: 'Not Contacted', lastContacted: null, emailHistory: [] },
      { id: '7', name: 'Gopher Hole', city: 'Flagstaff', state: 'AZ', phone: '(928) 779-1919', email: '', address: '23 N Leroux St. , Flagstaff,AZ', notes: '', status: 'Booked', lastContacted: '2025-11-07', emailHistory: [] },
      { id: '8', name: 'Blarney Stone Pub', city: 'San Diego', state: 'CA', phone: '(858) 279-2033', email: 'blarneystonepub@gmail.com', address: '5617 Balboa Ave. San Diego, CA 92111', notes: '', status: 'Not Contacted', lastContacted: null, emailHistory: [] },
      { id: '9', name: 'Bottom Of The Hill', city: 'San Francisco', state: 'CA', phone: '(415) 626-4455', email: 'booking@bottomofthehill.com', address: '1233 17th St, San Francisco, CA 94107', notes: '', status: 'Not Contacted', lastContacted: null, emailHistory: [] },
      { id: '10', name: 'Yucca Tap Room', city: 'Tempe', state: 'AZ', phone: '(480) 967-4777', email: 'admin@yuccatap.com', address: '29 W Southern Ave', notes: 'alt: gotriddem@gmail.com', status: 'Not Contacted', lastContacted: null, emailHistory: [] },
      { id: '11', name: 'The Rock', city: 'Tucson', state: 'AZ', phone: '(520) 629-9211', email: 'bookinginfo.therocktucson@gmail.com', address: '136 N Park Ave, Tucson, AZ 85719', notes: '', status: 'Booked', lastContacted: '2025-11-21', emailHistory: [] },
      { id: '12', name: 'Snake Bite Roadhouse', city: 'Yucca Valley', state: 'CA', phone: '(760) 820-1515', email: 'info@snakebiteroadhouse.com', address: '55405 29 Palms Hwy., Yucca Valley, CA 92284', notes: '', status: 'Booked', lastContacted: '2025-11-01', emailHistory: [] }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('venues');
      const [bandInfo, setBandInfo] = useState(null);
      const [venues, setVenues] = useState([]);
      const [showBandSetup, setShowBandSetup] = useState(false);
      const [showVenueForm, setShowVenueForm] = useState(false);
      const [editingVenue, setEditingVenue] = useState(null);
      const [searchTerm, setSearchTerm] = useState('');
      const [filterStatus, setFilterStatus] = useState('All');
      const [showEmailGenerator, setShowEmailGenerator] = useState(false);
      const [selectedVenue, setSelectedVenue] = useState(null);
      const [loading, setLoading] = useState(true);
      const [showBulkImport, setShowBulkImport] = useState(false);

      useEffect(() => {
        loadData();
      }, []);

      async function loadData() {
        try {
          const bandData = localStorage.getItem('band-info');
          const venuesData = localStorage.getItem('venues-list');
          
          if (bandData) {
            setBandInfo(JSON.parse(bandData));
          } else {
            setShowBandSetup(true);
          }
          
          if (venuesData) {
            setVenues(JSON.parse(venuesData));
          }
        } catch (error) {
          console.log('First time setup');
          setShowBandSetup(true);
        }
        setLoading(false);
      }

      async function saveBandInfo(info) {
        localStorage.setItem('band-info', JSON.stringify(info));
        setBandInfo(info);
        setShowBandSetup(false);
      }

      async function saveVenues(newVenues) {
        localStorage.setItem('venues-list', JSON.stringify(newVenues));
        setVenues(newVenues);
      }

      async function loadSampleVenues() {
        await saveVenues(SAMPLE_VENUES);
      }

      async function addVenue(venue) {
        const newVenue = {
          ...venue,
          id: Date.now().toString(),
          status: 'Not Contacted',
          lastContacted: null,
          emailHistory: []
        };
        await saveVenues([...venues, newVenue]);
        setShowVenueForm(false);
      }

      async function updateVenue(updatedVenue) {
        await saveVenues(venues.map(v => v.id === updatedVenue.id ? updatedVenue : v));
        setEditingVenue(null);
        setShowVenueForm(false);
      }

      async function deleteVenue(id) {
        if (confirm('Delete this venue?')) {
          await saveVenues(venues.filter(v => v.id !== id));
        }
      }

      async function logEmail(venueId, emailType, emailContent) {
        const venue = venues.find(v => v.id === venueId);
        const updatedVenue = {
          ...venue,
          status: 'Waiting',
          lastContacted: new Date().toISOString().split('T')[0],
          emailHistory: [...venue.emailHistory, {
            date: new Date().toISOString(),
            type: emailType,
            content: emailContent
          }]
        };
        await updateVenue(updatedVenue);
      }

      function openEmailGenerator(venue) {
        setSelectedVenue(venue);
        setShowEmailGenerator(true);
      }

      const filteredVenues = venues.filter(v => {
        const matchesSearch = v.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                            v.city.toLowerCase().includes(searchTerm.toLowerCase());
        const matchesFilter = filterStatus === 'All' || v.status === filterStatus;
        return matchesSearch && matchesFilter;
      });

      if (loading) {
        return (
          <div className="min-h-screen flex items-center justify-center">
            <div className="text-white text-2xl">Loading...</div>
          </div>
        );
      }

      if (showBandSetup) {
        return <BandSetup onSave={saveBandInfo} initialData={bandInfo} />;
      }

      if (showBulkImport) {
        return <BulkImport onImport={async (imported) => {
          await saveVenues([...venues, ...imported]);
          setShowBulkImport(false);
        }} onCancel={() => setShowBulkImport(false)} />;
      }

      if (showVenueForm) {
        return <VenueForm 
          venue={editingVenue}
          onSave={editingVenue ? updateVenue : addVenue}
          onCancel={() => {
            setShowVenueForm(false);
            setEditingVenue(null);
          }}
        />;
      }

      if (showEmailGenerator) {
        return <EmailGenerator 
          venue={selectedVenue}
          bandInfo={bandInfo}
          onClose={() => {
            setShowEmailGenerator(false);
            setSelectedVenue(null);
          }}
          onSend={logEmail}
        />;
      }

      return (
        <div className="min-h-screen p-4 pb-24">
          {/* Header */}
          <div className="bg-white rounded-2xl shadow-xl p-6 mb-4">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="bg-gradient-to-br from-purple-500 to-blue-500 p-3 rounded-xl">
                  <Music className="text-white" size={28} />
                </div>
                <div>
                  <h1 className="text-2xl font-bold text-gray-900">{bandInfo?.bandName || 'Band Manager'}</h1>
                  <p className="text-sm text-gray-600">{venues.length} venues</p>
                </div>
              </div>
              <button
                onClick={() => setShowBandSetup(true)}
                className="p-3 bg-gray-100 rounded-xl hover:bg-gray-200 transition-colors"
              >
                <Settings size={24} className="text-gray-700" />
              </button>
            </div>
          </div>

          {/* Main Content */}
          {activeTab === 'venues' && (
            <div>
              {/* Search & Filter */}
              <div className="bg-white rounded-2xl shadow-xl p-4 mb-4">
                <div className="flex gap-2 mb-3">
                  <div className="flex-1 relative">
                    <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" size={20} />
                    <input
                      type="text"
                      placeholder="Search venues or cities..."
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="w-full pl-10 pr-4 py-3 border-2 border-gray-200 rounded-xl text-lg focus:outline-none focus:border-purple-500"
                    />
                  </div>
                </div>
                <div className="flex gap-2 overflow-x-auto pb-2">
                  {['All', 'Not Contacted', 'Waiting', 'Booked', 'Passed'].map(status => (
                    <button
                      key={status}
                      onClick={() => setFilterStatus(status)}
                      className={`px-4 py-2 rounded-lg whitespace-nowrap font-medium transition-colors ${
                        filterStatus === status
                          ? 'bg-gradient-to-r from-purple-500 to-blue-500 text-white'
                          : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                      }`}
                    >
                      {status}
                    </button>
                  ))}
                </div>
              </div>

              {/* Action Buttons */}
              <div className="grid grid-cols-2 gap-3 mb-4">
                <button
                  onClick={() => setShowVenueForm(true)}
                  className="bg-gradient-to-r from-green-500 to-emerald-500 text-white py-4 rounded-xl font-bold text-lg shadow-lg hover:shadow-xl transition-all"
                >
                  <Plus className="inline mr-2" size={24} />
                  Add Venue
                </button>
                <button
                  onClick={() => setShowBulkImport(true)}
                  className="bg-gradient-to-r from-blue-500 to-indigo-500 text-white py-4 rounded-xl font-bold text-lg shadow-lg hover:shadow-xl transition-all"
                >
                  <Upload className="inline mr-2" size={24} />
                  Bulk Import
                </button>
              </div>

              {venues.length === 0 && (
                <div className="bg-white rounded-2xl shadow-xl p-8 text-center">
                  <p className="text-gray-600 text-lg mb-4">No venues yet!</p>
                  <button
                    onClick={loadSampleVenues}
                    className="bg-gradient-to-r from-purple-500 to-blue-500 text-white px-6 py-3 rounded-xl font-bold text-lg"
                  >
                    Load Sample Venues
                  </button>
                </div>
              )}

              {/* Venues List */}
              <div className="space-y-3">
                {filteredVenues.map(venue => (
                  <VenueCard
                    key={venue.id}
                    venue={venue}
                    onEdit={() => {
                      setEditingVenue(venue);
                      setShowVenueForm(true);
                    }}
                    onDelete={() => deleteVenue(venue.id)}
                    onEmail={() => openEmailGenerator(venue)}
                  />
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    function BandSetup({ onSave, initialData }) {
      const [bandName, setBandName] = useState(initialData?.bandName || '');
      const [bandleaderName, setBandleaderName] = useState(initialData?.bandleaderName || '');
      const [bio, setBio] = useState(initialData?.bio || '');

      function handleSave() {
        if (!bandName || !bandleaderName) {
          alert('Please fill in band name and your name');
          return;
        }
        onSave({ bandName, bandleaderName, bio });
      }

      return (
        <div className="min-h-screen p-4 flex items-center justify-center">
          <div className="bg-white rounded-2xl shadow-xl p-8 max-w-lg w-full">
            <div className="text-center mb-6">
              <div className="bg-gradient-to-br from-purple-500 to-blue-500 p-4 rounded-xl inline-block mb-4">
                <Music className="text-white" size={48} />
              </div>
              <h1 className="text-3xl font-bold text-gray-900 mb-2">Band Setup</h1>
              <p className="text-gray-600">Let's get your info set up</p>
            </div>

            <div className="space-y-4">
              <div>
                <label className="block text-lg font-semibold text-gray-700 mb-2">Band Name</label>
                <input
                  type="text"
                  value={bandName}
                  onChange={(e) => setBandName(e.target.value)}
                  className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-lg focus:outline-none focus:border-purple-500"
                  placeholder="Your Band Name"
                />
              </div>

              <div>
                <label className="block text-lg font-semibold text-gray-700 mb-2">Your Name</label>
                <input
                  type="text"
                  value={bandleaderName}
                  onChange={(e) => setBandleaderName(e.target.value)}
                  className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-lg focus:outline-none focus:border-purple-500"
                  placeholder="Your Name"
                />
              </div>

              <div>
                <label className="block text-lg font-semibold text-gray-700 mb-2">Band Bio (Optional)</label>
                <textarea
                  value={bio}
                  onChange={(e) => setBio(e.target.value)}
                  rows="4"
                  className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-lg focus:outline-none focus:border-purple-500"
                  placeholder="Tell venues about your band..."
                />
              </div>

              <button
                onClick={handleSave}
                className="w-full bg-gradient-to-r from-purple-500 to-blue-500 text-white py-4 rounded-xl font-bold text-xl shadow-lg hover:shadow-xl transition-all"
              >
                Save & Continue
              </button>
            </div>
          </div>
        </div>
      );
    }

    function VenueForm({ venue, onSave, onCancel }) {
      const [formData, setFormData] = useState(venue || {
        name: '', city: '', state: '', phone: '', email: '', address: '', notes: ''
      });

      function handleSubmit() {
        if (!formData.name || !formData.city) {
          alert('Please fill in venue name and city');
          return;
        }
        onSave(formData);
      }

      return (
        <div className="min-h-screen p-4">
          <div className="bg-white rounded-2xl shadow-xl p-6 max-w-2xl mx-auto">
            <div className="flex items-center justify-between mb-6">
              <h2 className="text-2xl font-bold text-gray-900">
                {venue ? 'Edit Venue' : 'Add Venue'}
              </h2>
              <button onClick={onCancel} className="p-2 hover:bg-gray-100 rounded-lg">
                <X size={24} />
              </button>
            </div>

            <div className="space-y-4">
              <div>
                <label className="block text-lg font-semibold text-gray-700 mb-2">Venue Name *</label>
                <input
                  type="text"
                  value={formData.name}
                  onChange={(e) => setFormData({...formData, name: e.target.value})}
                  className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-lg"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-lg font-semibold text-gray-700 mb-2">City *</label>
                  <input
                    type="text"
                    value={formData.city}
                    onChange={(e) => setFormData({...formData, city: e.target.value})}
                    className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-lg"
                  />
                </div>
                <div>
                  <label className="block text-lg font-semibold text-gray-700 mb-2">State</label>
                  <input
                    type="text"
                    value={formData.state}
                    onChange={(e) => setFormData({...formData, state: e.target.value})}
                    className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-lg"
                  />
                </div>
              </div>

              <div>
                <label className="block text-lg font-semibold text-gray-700 mb-2">Phone</label>
                <input
                  type="tel"
                  value={formData.phone}
                  onChange={(e) => setFormData({...formData, phone: e.target.value})}
                  className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-lg"
                />
              </div>

              <div>
                <label className="block text-lg font-semibold text-gray-700 mb-2">Email</label>
                <input
                  type="email"
                  value={formData.email}
                  onChange={(e) => setFormData({...formData, email: e.target.value})}
                  className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-lg"
                />
              </div>

              <div>
                <label className="block text-lg font-semibold text-gray-700 mb-2">Address</label>
                <input
                  type="text"
                  value={formData.address}
                  onChange={(e) => setFormData({...formData, address: e.target.value})}
                  className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-lg"
                />
              </div>

              <div>
                <label className="block text-lg font-semibold text-gray-700 mb-2">Notes</label>
                <textarea
                  value={formData.notes}
                  onChange={(e) => setFormData({...formData, notes: e.target.value})}
                  rows="3"
                  className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-lg"
                />
              </div>

              <div className="flex gap-3 pt-4">
                <button
                  onClick={onCancel}
                  className="flex-1 bg-gray-200 text-gray-700 py-4 rounded-xl font-bold text-lg"
                >
                  Cancel
                </button>
                <button
                  onClick={handleSubmit}
                  className="flex-1 bg-gradient-to-r from-purple-500 to-blue-500 text-white py-4 rounded-xl font-bold text-lg"
                >
                  Save
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function VenueCard({ venue, onEdit, onDelete, onEmail }) {
      const statusColors = {
        'Not Contacted': 'bg-gray-200 text-gray-700',
        'Waiting': 'bg-yellow-200 text-yellow-800',
        'Booked': 'bg-green-200 text-green-800',
        'Passed': 'bg-red-200 text-red-800'
      };

      return (
        <div className="bg-white rounded-xl shadow-lg p-5">
          <div className="flex items-start justify-between mb-3">
            <div className="flex-1">
              <h3 className="text-xl font-bold text-gray-900">{venue.name}</h3>
              <p className="text-gray-600">
                {venue.city}{venue.state && `, ${venue.state}`}
              </p>
            </div>
            <span className={`px-3 py-1 rounded-full text-sm font-semibold ${statusColors[venue.status]}`}>
              {venue.status}
            </span>
          </div>

          {venue.lastContacted && (
            <p className="text-sm text-gray-500 mb-3">
              Last contacted: {new Date(venue.lastContacted).toLocaleDateString()}
            </p>
          )}

          <div className="flex flex-wrap gap-2 mb-4">
            {venue.phone && (
              <a
                href={`tel:${venue.phone}`}
                className="flex items-center gap-2 px-4 py-2 bg-blue-100 text-blue-700 rounded-lg font-medium"
              >
                <Phone size={18} />
                Call
              </a>
            )}
            {venue.email && (
              <a
                href={`mailto:${venue.email}`}
                className="flex items-center gap-2 px-4 py-2 bg-purple-100 text-purple-700 rounded-lg font-medium"
              >
                <Mail size={18} />
                Email
              </a>
            )}
            {venue.address && (
              <a
                href={`https://maps.google.com/?q=${encodeURIComponent(venue.address)}`}
                target="_blank"
                rel="noopener noreferrer"
                className="flex items-center gap-2 px-4 py-2 bg-green-100 text-green-700 rounded-lg font-medium"
              >
                <MapPin size={18} />
                Map
              </a>
            )}
          </div>

          <div className="flex gap-2">
            <button
              onClick={onEmail}
              className="flex-1 bg-gradient-to-r from-purple-500 to-blue-500 text-white py-3 rounded-lg font-bold"
            >
              Send Email
            </button>
            <button onClick={onEdit} className="px-4 py-3 bg-gray-100 rounded-lg">
              <Edit size={20} />
            </button>
            <button onClick={onDelete} className="px-4 py-3 bg-red-100 text-red-600 rounded-lg">
              <Trash2 size={20} />
            </button>
          </div>
        </div>
      );
    }

    function EmailGenerator({ venue, bandInfo, onClose, onSend }) {
      const [emailType, setEmailType] = useState('First Contact');
      const [gigDate, setGigDate] = useState('');
      const [gigType, setGigType] = useState('Original Music');
      const [specialDetails, setSpecialDetails] = useState('');
      const [generatedEmail, setGeneratedEmail] = useState('');
      const [copied, setCopied] = useState(false);

      useEffect(() => {
        generateEmail();
      }, [emailType, gigDate, gigType, specialDetails]);

      function generateEmail() {
        let email = '';
        
        if (emailType === 'First Contact') {
          email = `Subject: ${bandInfo.bandName} - Booking Inquiry

Hi there,

My name is ${bandInfo.bandleaderName} and I'm the bandleader for ${bandInfo.bandName}. We're a ${gigType.toLowerCase()} band${bandInfo.bio ? ' - ' + bandInfo.bio : ''}.

We'd love to perform at ${venue.name}${gigDate ? ` on ${new Date(gigDate).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}` : ''}. ${specialDetails}

Would you have any availability for us? We're flexible on dates and always put on a great show.

Looking forward to hearing from you!

Best regards,
${bandInfo.bandleaderName}
${bandInfo.bandName}`;
        } else if (emailType === 'Follow Up') {
          email = `Subject: Following Up - ${bandInfo.bandName}

Hi there,

I wanted to follow up on my previous email about ${bandInfo.bandName} performing at ${venue.name}${gigDate ? ` on ${new Date(gigDate).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}` : ''}.

${specialDetails || 'We\'re still very interested in playing your venue and would love to discuss available dates.'}

Please let me know if you have any questions or would like to hear our music.

Thanks,
${bandInfo.bandleaderName}
${bandInfo.bandName}`;
        } else {
          email = `Subject: Confirming ${bandInfo.bandName} Performance

Hi there,

I wanted to confirm our upcoming performance at ${venue.name}${gigDate ? ` on ${new Date(gigDate).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}` : ''}.

${specialDetails || 'Please let me know if you need any additional information from us.'}

Looking forward to playing for you!

Best,
${bandInfo.bandleaderName}
${bandInfo.bandName}`;
        }
        
        setGeneratedEmail(email);
      }

      async function copyToClipboard() {
        await navigator.clipboard.writeText(generatedEmail);
        setCopied(true);
        await onSend(venue.id, emailType, generatedEmail);
        setTimeout(() => setCopied(false), 2000);
      }

      return (
        <div className="min-h-screen p-4">
          <div className="bg-white rounded-2xl shadow-xl p-6 max-w-2xl mx-auto">
            <div className="flex items-center justify-between mb-6">
              <div>
                <h2 className="text-2xl font-bold text-gray-900">Email Generator</h2>
                <p className="text-gray-600">{venue.name}</p>
              </div>
              <button onClick={onClose} className="p-2 hover:bg-gray-100 rounded-lg">
                <X size={24} />
              </button>
            </div>

            <div className="space-y-4 mb-6">
              <div>
                <label className="block text-lg font-semibold text-gray-700 mb-2">Email Type</label>
                <div className="grid grid-cols-3 gap-2">
                  {['First Contact', 'Follow Up', 'Confirm Details'].map(type => (
                    <button
                      key={type}
                      onClick={() => setEmailType(type)}
                      className={`py-3 rounded-lg font-medium ${
                        emailType === type
                          ? 'bg-gradient-to-r from-purple-500 to-blue-500 text-white'
                          : 'bg-gray-100 text-gray-700'
                      }`}
                    >
                      {type}
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="block text-lg font-semibold text-gray-700 mb-2">Preferred Date (Optional)</label>
                <input
                  type="date"
                  value={gigDate}
                  onChange={(e) => setGigDate(e.target.value)}
                  className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-lg"
                />
              </div>

              <div>
                <label className="block text-lg font-semibold text-gray-700 mb-2">Gig Type</label>
                <div className="grid grid-cols-2 gap-2">
                  {['Original Music', 'Covers', 'Mix', 'Private Event'].map(type => (
                    <button
                      key={type}
                      onClick={() => setGigType(type)}
                      className={`py-3 rounded-lg font-medium ${
                        gigType === type
                          ? 'bg-gradient-to-r from-purple-500 to-blue-500 text-white'
                          : 'bg-gray-100 text-gray-700'
                      }`}
                    >
                      {type}
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="block text-lg font-semibold text-gray-700 mb-2">Special Details (Optional)</label>
                <textarea
                  value={specialDetails}
                  onChange={(e) => setSpecialDetails(e.target.value)}
                  rows="2"
                  className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-lg"
                  placeholder="Any special info to include..."
                />
              </div>
            </div>

            <div className="bg-gray-50 rounded-xl p-4 mb-4">
              <h3 className="font-semibold text-gray-700 mb-2">Generated Email:</h3>
              <pre className="whitespace-pre-wrap text-sm text-gray-800 font-mono">
                {generatedEmail}
              </pre>
            </div>

            <button
              onClick={copyToClipboard}
              className="w-full bg-gradient-to-r from-green-500 to-emerald-500 text-white py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2"
            >
              {copied ? (
                <>
                  <Check size={24} />
                  Copied & Logged!
                </>
              ) : (
                <>
                  <Copy size={24} />
                  Copy Email
                </>
              )}
            </button>
          </div>
        </div>
      );
    }

    function BulkImport({ onImport, onCancel }) {
      const [pastedData, setPastedData] = useState('');
      const [preview, setPreview] = useState([]);

      function parseData() {
        const lines = pastedData.trim().split('\n');
        const venues = [];
        
        lines.forEach((line, idx) => {
          if (idx === 0) return; // Skip header
          const parts = line.split('\t');
          if (parts.length >= 2) {
            venues.push({
              id: Date.now().toString() + idx,
              name: parts[0] || '',
              city: parts[1] || '',
              state: parts[2] || '',
              phone: parts[4] || '',
              email: parts[5] || '',
              address: parts[9] || '',
              notes: parts[7] || '',
              status: 'Not Contacted',
              lastContacted: null,
              emailHistory: []
            });
          }
        });
        
        setPreview(venues);
      }

      return (
        <div className="min-h-screen p-4">
          <div className="bg-white rounded-2xl shadow-xl p-6 max-w-4xl mx-auto">
            <div className="flex items-center justify-between mb-6">
              <h2 className="text-2xl font-bold text-gray-900">Bulk Import Venues</h2>
              <button onClick={onCancel} className="p-2 hover:bg-gray-100 rounded-lg">
                <X size={24} />
              </button>
            </div>

            <div className="mb-6">
              <p className="text-gray-600 mb-4">
                Paste your tab-separated data from Excel. Expected columns: Venue Name, City, State, Phone, Email, etc.
              </p>
              <textarea
                value={pastedData}
                onChange={(e) => setPastedData(e.target.value)}
                rows="10"
                className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm font-mono"
                placeholder="Paste your Excel data here..."
              />
            </div>

            <div className="flex gap-3 mb-6">
              <button
                onClick={parseData}
                className="flex-1 bg-blue-500 text-white py-3 rounded-xl font-bold"
              >
                Preview Import
              </button>
            </div>

            {preview.length > 0 && (
              <>
                <div className="bg-green-50 border-2 border-green-200 rounded-xl p-4 mb-4">
                  <p className="text-green-800 font-semibold">
                    ✓ Found {preview.length} venues to import
                  </p>
                </div>

                <div className="max-h-96 overflow-y-auto mb-6 space-y-2">
                  {preview.slice(0, 10).map((venue, idx) => (
                    <div key={idx} className="bg-gray-50 p-3 rounded-lg">
                      <p className="font-semibold">{venue.name}</p>
                      <p className="text-sm text-gray-600">{venue.city}, {venue.state}</p>
                    </div>
                  ))}
                  {preview.length > 10 && (
                    <p className="text-center text-gray-500">
                      ...and {preview.length - 10} more
                    </p>
                  )}
                </div>

                <button
                  onClick={() => onImport(preview)}
                  className="w-full bg-gradient-to-r from-green-500 to-emerald-500 text-white py-4 rounded-xl font-bold text-lg"
                >
                  Import {preview.length} Venues
                </button>
              </>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
