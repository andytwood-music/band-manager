      async function loadData() {
        if (!db) {
          alert('Firebase not configured. Please add your Firebase config.');
          setLoading(false);
          return;
        }

        try {
          // Load available dates
          const availsDoc = await db.collection('config').doc('availableDates').get();
          if (availsDoc.exists) {
            setSavedAvailableDates(availsDoc.data().dates || '');
          }

          // Load venues with real-time updates
          db.collection('venues').onSnapshot(snapshot => {
            const venuesData = snapshot.docs.map(doc => ({
              id: doc.id,
              ...doc.data()
            }));
            setVenues(venuesData);
            setLoading(false);
          });
        } catch (error) {
          console.error('Error loading data:', error);
          setLoading(false);
        }
      }

      async function saveAvailableDates(dates) {
        if (!db) return;
        try {
          await db.collection('config').doc('availableDates').set({ dates });
          setSavedAvailableDates(dates);
          setShowAvails(false);
        } catch (error) {
          console.error('Error saving available dates:', error);
          alert('Error saving available dates');
        }
      }

          });

          setEditingVenue(null);

        if (!db) return;

      async function logEmail(venueId, emailType, emailContent) {
        if (!db) return;
        try {
          const venue = venues.find(v => v.id === venueId);
          const emailHistory = venue.emailHistory || [];
          emailHistory.push({
            date: new Date().toISOString(),
            type: emailType,
            content: emailContent
          });
          
          await db.collection('venues').doc(venueId).update({
            emailHistory,
            lastContacted: new Date().toISOString(),
            status: venue.status === 'Not Contacted' ? 'Waiting' : venue.status
          });
        } catch (error) {
          console.error('Error logging email:', error);
        }
      }

      function downloadCSV() {
        const headers = [
          'Venue Name', 'City', 'State', 'Played Before?', 'Phone Number',
          'Email Address', 'Category', 'Notes / Last Called', 'Most Recent Booking',
          'Address', 'Website/Social'
        ];

        const rows = venues.map(v => [
          v.name || '', v.city || '', v.state || '',
          v.playedBefore ? 'Yes' : '', v.phone || '', v.email || '',
          v.category || '', v.notes || '', v.mostRecentlyPlayed || '',
          v.address || '', v.website || ''
        ]);

        const csvContent = [
          headers.join('\t'),
          ...rows.map(row => row.join('\t'))
        ].join('\n');

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.setAttribute('href', url);
        link.setAttribute('download', `venues_${new Date().toISOString().split('T')[0]}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }

      // Auto-fill missing venue info using Google Places API (New)
      async function autoFillMissingInfo() {
        if (!db) return;
        
        const venuesToFill = venues.filter(v => 
          v.city && v.state && (!v.address || !v.phone || !v.website)
        );

        if (venuesToFill.length === 0) {
          alert('All venues already have complete information!');
          return;
        }

        if (!window.confirm(`This will search Google Places for ${venuesToFill.length} venues and auto-fill missing info.\n\nNote: This uses your Google API quota. Continue?`)) {
          return;
        }

        let processed = 0;
        let updated = 0;
        let failed = 0;
        const results = [];

        for (const venue of venuesToFill) {
          processed++;
          
          try {
            // Use Text Search (New) API
            const searchQuery = encodeURIComponent(`${venue.name}, ${venue.city}, ${venue.state}`);
            const searchUrl = `https://places.googleapis.com/v1/places:searchText`;
            
            const searchResponse = await fetch(searchUrl, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-Goog-Api-Key': GOOGLE_MAPS_API_KEY,
                'X-Goog-FieldMask': 'places.displayName,places.formattedAddress,places.nationalPhoneNumber,places.websiteUri,places.location'
              },
              body: JSON.stringify({
                textQuery: `${venue.name}, ${venue.city}, ${venue.state}`
              })
            });

            const searchData = await searchResponse.json();

            if (searchData.places && searchData.places.length > 0) {
              const place = searchData.places[0];
              const updates = {};

              if (!venue.address && place.formattedAddress) {
                updates.address = place.formattedAddress;
              }
              if (!venue.phone && place.nationalPhoneNumber) {
                updates.phone = place.nationalPhoneNumber;
              }
              if (!venue.website && place.websiteUri) {
                updates.website = place.websiteUri;
              }
              if (place.location) {
                updates.latitude = place.location.latitude;
                updates.longitude = place.location.longitude;
              }

              if (Object.keys(updates).length > 0) {
                await db.collection('venues').doc(venue.id).update(updates);
                updated++;
                results.push(`✓ ${venue.name}: ${Object.keys(updates).join(', ')}`);
              } else {
                results.push(`- ${venue.name}: No missing info found`);
              }
            } else {
              failed++;
              results.push(`✗ ${venue.name}: Not found in Google Places`);
            }

          } catch (error) {
            failed++;
            console.error(`Error processing ${venue.name}:`, error);
            results.push(`✗ ${venue.name}: Error - ${error.message}`);
          }

          // Update progress
          if (processed % 10 === 0 || processed === venuesToFill.length) {
            console.log(`Progress: ${processed}/${venuesToFill.length} - Updated: ${updated}, Failed: ${failed}`);
          }

          // Rate limit
          await new Promise(resolve => setTimeout(resolve, 200));
        }

        alert(`Auto-fill complete!\n\nProcessed: ${processed}\nUpdated: ${updated}\nFailed: ${failed}\n\nCheck console for details.`);
        console.log('=== AUTO-FILL RESULTS ===');
        results.forEach(r => console.log(r));
      }

      // Compute regions sorted by venue count (most venues first)
      const regionCounts = {};

    function VenueMap({ venues, onClose, onSelectVenue }) {
      const mapRef = React.useRef(null);
      const mapInstanceRef = React.useRef(null);
      const markersRef = React.useRef([]);
      const [mapLoaded, setMapLoaded] = React.useState(false);
      const [geocoding, setGeocoding] = React.useState(false);
      const [geocodedCount, setGeocodedCount] = React.useState(0);
      const [visibleStatuses, setVisibleStatuses] = React.useState({
        'Not Contacted': true,
        'Waiting': true,
        'Priority': true,
        'Booked': true,
        'Played': true,
        'Passed': true,
        'Closed': true
      });

      const statusColors = {
        'Not Contacted': '#9CA3AF',
        'Waiting': '#EAB308',
        'Priority': '#F97316',
        'Booked': '#10B981',
        'Played': '#3B82F6',
        'Passed': '#EF4444',
        'Closed': '#6B7280'
      };

      // Load Google Maps script
      React.useEffect(() => {
        if (window.google && window.google.maps) {
          setMapLoaded(true);
          return;
        }

        if (GOOGLE_MAPS_API_KEY === "YOUR_GOOGLE_MAPS_API_KEY_HERE") {
          alert("Please add your Google Maps API key to the HTML file!");
          return;
        }

        const script = document.createElement('script');
        script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&libraries=geometry,places`;
        script.async = true;
        script.defer = true;
        script.onload = () => setMapLoaded(true);
        script.onerror = () => alert("Failed to load Google Maps");
        document.head.appendChild(script);
      }, []);

      // Initialize map and add markers
      React.useEffect(() => {
        if (!mapLoaded || !mapRef.current) return;

        // Create map only once
        if (!mapInstanceRef.current) {
          mapInstanceRef.current = new google.maps.Map(mapRef.current, {
            center: { lat: 33.8, lng: -116.5 }, // Centered on Palm Springs area
            zoom: 8,
            styles: []
          });
        }

        const map = mapInstanceRef.current;
        const bounds = new google.maps.LatLngBounds();
        let markerCount = 0;

        // Clear old markers
        markersRef.current.forEach(m => m.setMap(null));
        markersRef.current = [];

        // Add markers for venues with coordinates and visible status
        venues.forEach(venue => {
          if (venue.latitude && venue.longitude && visibleStatuses[venue.status]) {
            const position = { lat: venue.latitude, lng: venue.longitude };
            
            const marker = new google.maps.Marker({
              position: position,
              map: map,
              title: venue.name,
              icon: {
                path: google.maps.SymbolPath.CIRCLE,
                scale: 8,
                fillColor: statusColors[venue.status] || '#9CA3AF',
                fillOpacity: 0.9,
                strokeColor: '#FFFFFF',
                strokeWeight: 2
              }
            });

            markersRef.current.push(marker);

            const infoWindow = new google.maps.InfoWindow({
              content: `

      // Geocode venues without coordinates
      async function geocodeVenues() {
        if (!db) return;
        console.log('Starting geocoding...');
        setGeocoding(true);
        setGeocodedCount(0);

        const venuesToGeocode = venues.filter(v => v.address && !v.latitude && !v.geocodeFailed);
        
        if (venuesToGeocode.length === 0) {
          alert('No venues need geocoding! All venues with addresses have been geocoded.');
          setGeocoding(false);
          return;
        }
        
        console.log(`Found ${venuesToGeocode.length} venues to geocode`);
        console.log('Venues to geocode:', venuesToGeocode.map(v => v.name));
        
        let successCount = 0;
        let failCount = 0;
        
        for (let i = 0; i < venuesToGeocode.length; i++) {
          const venue = venuesToGeocode[i];
          console.log(`Geocoding ${i + 1}/${venuesToGeocode.length}: ${venue.name}`);
          console.log(`Address: ${venue.address}, ${venue.city}, ${venue.state}`);
          
          try {
            const url = `https://maps.googleapis.com/maps/api/geocode/json?address=${encodeURIComponent(venue.address + ', ' + venue.city + ', ' + venue.state)}&key=${GOOGLE_MAPS_API_KEY}`;
            const response = await fetch(url);
            const data = await response.json();
            
            if (data.results && data.results[0]) {
              const location = data.results[0].geometry.location;
              console.log(`✓ ${venue.name}: Got coordinates:`, location);
              await db.collection('venues').doc(venue.id).update({
                latitude: location.lat,
                longitude: location.lng
              });
              successCount++;
              setGeocodedCount(i + 1);
            } else {
              console.error(`✗ ${venue.name}: No results. Status:`, data.status);
              // Mark as failed so we don't keep trying
              await db.collection('venues').doc(venue.id).update({
                geocodeFailed: true,
                geocodeFailReason: data.status || 'No results'
              });
              failCount++;
            }
            
            // Rate limit
            await new Promise(resolve => setTimeout(resolve, 1000));
          } catch (error) {
            console.error(`✗ ${venue.name}: Error:`, error);
            failCount++;
          }
        }

        setGeocoding(false);
        alert(`Geocoding complete!\n\nSuccess: ${successCount}\nFailed: ${failCount}\n\nReload the map to see updates.`);
      }

      const venuesWithCoords = venues.filter(v => v.latitude && v.longitude).length;
      const venuesWithAddresses = venues.filter(v => v.address).length;
      const needsGeocoding = venues.filter(v => v.address && !v.latitude && !v.geocodeFailed).length;

      return React.createElement('div', {
        className: 'fixed inset-0 bg-gray-900 z-50 flex flex-col'
      },
        // Header
        React.createElement('div', {
          className: 'bg-white p-4 shadow-lg flex items-center justify-between'
        },
          React.createElement('div', null,
            React.createElement('h2', {
              className: 'text-xl font-bold text-gray-900'
            }, 'Venue Map'),
            React.createElement('p', {
              className: 'text-sm text-gray-600'
            }, `${venuesWithCoords} of ${venuesWithAddresses} venues mapped`)
          ),
          React.createElement('div', {
            className: 'flex gap-2'
          },
            needsGeocoding > 0 && React.createElement('button', {
              onClick: geocodeVenues,
              disabled: geocoding,
              className: 'px-4 py-2 bg-blue-500 text-white rounded-lg font-medium hover:bg-blue-600 disabled:opacity-50'
            }, geocoding ? `Geocoding... ${geocodedCount}/${needsGeocoding}` : `Geocode ${needsGeocoding} venues`),
            React.createElement('button', {
              onClick: onClose,
              className: 'p-2 hover:bg-gray-100 rounded-lg transition-colors'
            }, React.createElement(Icon, { name: 'X', size: 24 }))
          )
        ),

        // Map
        React.createElement('div', {
          ref: mapRef,
          className: 'flex-1'
        }),

        // Legend with status filters
        React.createElement('div', {
          className: 'bg-white p-4 shadow-lg'

            React.createElement('label', {
              key: status,
              className: 'flex items-center gap-2 cursor-pointer hover:bg-gray-50 px-2 py-1 rounded'
            },
              React.createElement('input', {
                type: 'checkbox',
                checked: visibleStatuses[status],
                onChange: (e) => {
                  setVisibleStatuses({
                    ...visibleStatuses,
                    [status]: e.target.checked

            updates.merchSales = parseInt(merch);

      async function copyToClipboard() {
        try {
          await navigator.clipboard.writeText(generatedEmail);
          setCopied(true);

        } catch (error) {
          console.error('Copy failed:', error);

        const subjectMatch = generatedEmail.match(/^Subject: (.+)$/m);

        const bodyStart = generatedEmail.indexOf('\n\n') + 2;
        const body = generatedEmail.substring(bodyStart);
        
        // Split into lines, encode each line separately, then join with line breaks
        const lines = body.split('\n');
        const encodedLines = lines.map(line => encodeURIComponent(line));
        const encodedBody = encodedLines.join('%0D%0A');

            }, 'Generated Email:'),
            React.createElement('textarea', {
              value: generatedEmail,
              onChange: (e) => setGeneratedEmail(e.target.value),
              rows: 15,
              className: 'w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm font-mono bg-white focus:outline-none focus:border-purple-500'
            })
          ),

          // Action Buttons
          React.createElement('div', {
            className: 'flex gap-3'
          },
            React.createElement('button', {
              onClick: copyToClipboard,
              className: 'flex-1 bg-gradient-to-r from-blue-500 to-indigo-500 text-white py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2'
            },
              copied 
                ? React.createElement(React.Fragment, null,
                    React.createElement(Icon, { name: 'Check', size: 24 }),
                    'Copied!'
                  )
                : React.createElement(React.Fragment, null,
                    React.createElement(Icon, { name: 'Copy', size: 24 }),
                    'Copy'
                  )
            ),
            React.createElement('button', {
              onClick: sendEmail,
              className: 'flex-1 bg-gradient-to-r from-green-500 to-emerald-500 text-white py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2'
            },
              React.createElement(Icon, { name: 'Mail', size: 24 }),
              'Send Email'
            )
          )
        )
      );
    }

    // ============================================
    // BULK IMPORT COMPONENT
    // ============================================
    function BulkImport({ onImport, onCancel }) {
      const [pastedData, setPastedData] = React.useState('');
      const [preview, setPreview] = React.useState([]);

      function parseData() {
        const lines = pastedData.trim().split('\n');
        const venues = [];
        
        lines.forEach((line, idx) => {
          if (idx === 0) return; // Skip header
          const parts = line.split('\t');
          if (parts.length >= 2 && parts[0] && parts[1]) {
            const city = parts[1] || '';
            const region = getRegionForCity(city);
            venues.push({
              name: parts[0] || '',
              city: city,
              state: parts[2] || '',
              playedBefore: parts[3]?.toLowerCase() === 'yes' || parts[3]?.toLowerCase() === 'true',
              phone: parts[4] || '',
              email: parts[5] || '',
              category: parts[6] || '',
              notes: parts[7] || '',
              mostRecentlyPlayed: parts[8] || null,
              address: parts[9] || '',
              website: parts[10] || '',
              status: parts[11] || 'Not Contacted',
              region: region,
              lastContacted: null,
              emailHistory: []
            });
          }
        });
        
        setPreview(venues);
      }

      return React.createElement('div', {
        className: 'min-h-screen p-4'
      },
        React.createElement('div', {
          className: 'bg-white rounded-2xl shadow-xl p-6 max-w-4xl mx-auto'
        },
          React.createElement('div', {
            className: 'flex items-center justify-between mb-6'
          },
            React.createElement('h2', {
              className: 'text-2xl font-bold text-gray-900'
            }, 'Bulk Import Venues'),
            React.createElement('button', {
              onClick: onCancel,
              className: 'p-2 hover:bg-gray-100 rounded-lg'
            }, React.createElement(Icon, { name: 'X', size: 24 }))
          ),

          React.createElement('div', {
            className: 'mb-6'
          },
            React.createElement('p', {
              className: 'text-gray-600 mb-4'
            }, 'Paste your tab-separated data from Excel. Expected columns: Venue Name, City, State, Played Before?, Phone, Email, Category, Notes, Most Recent Booking, Address, Website'),
            React.createElement('textarea', {
              value: pastedData,
              onChange: (e) => setPastedData(e.target.value),
              rows: 10,
              className: 'w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm font-mono focus:outline-none focus:border-purple-500',
              placeholder: 'Paste your Excel data here (include header row)...'
            })
          ),

          React.createElement('div', {
            className: 'flex gap-3 mb-6'
          },
            React.createElement('button', {
              onClick: parseData,
              className: 'flex-1 bg-blue-500 text-white py-3 rounded-xl font-bold text-lg'
            }, 'Preview Import')
          ),

          preview.length > 0 && React.createElement(React.Fragment, null,
            React.createElement('div', {
              className: 'bg-green-50 border-2 border-green-200 rounded-xl p-4 mb-4'
            },
              React.createElement('p', {
                className: 'text-green-800 font-semibold'
              }, '✓ Found ' + preview.length + ' venues to import')
            ),

            React.createElement('div', {
              className: 'max-h-96 overflow-y-auto mb-6 space-y-2'
            },
              preview.slice(0, 10).map((venue, idx) =>
                React.createElement('div', {
                  key: idx,
                  className: 'bg-gray-50 p-3 rounded-lg'
                },
                  React.createElement('p', {
                    className: 'font-semibold'
                  }, venue.name),
                  React.createElement('p', {
                    className: 'text-sm text-gray-600'
                  }, venue.city + ', ' + venue.state)
                )
              ),
              preview.length > 10 && React.createElement('p', {
                className: 'text-center text-gray-500'
              }, '...and ' + (preview.length - 10) + ' more')
            ),

            React.createElement('button', {
              onClick: () => onImport(preview),
              className: 'w-full bg-gradient-to-r from-green-500 to-emerald-500 text-white py-4 rounded-xl font-bold text-lg'
            }, 'Import ' + preview.length + ' Venues')
          )
        )
      );
    }

    // ============================================
    // RENDER APP
    // ============================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
