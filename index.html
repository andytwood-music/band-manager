    // MAIN APP COMPONENT
    // ============================================
    function App() {
      const [bandInfo, setBandInfo] = React.useState(null);
      const [venues, setVenues] = React.useState([]);
      const [showBandSetup, setShowBandSetup] = React.useState(false);
      const [showVenueForm, setShowVenueForm] = React.useState(false);
      const [showBulkImport, setShowBulkImport] = React.useState(false);
      const [editingVenue, setEditingVenue] = React.useState(null);
      const [viewingVenue, setViewingVenue] = React.useState(null);
      const [emailVenue, setEmailVenue] = React.useState(null);
      const [loading, setLoading] = React.useState(true);
      const [searchTerm, setSearchTerm] = React.useState('');
      const [filterStatus, setFilterStatus] = React.useState('All');
      const [filterRegion, setFilterRegion] = React.useState('All');
      const [showCalendar, setShowCalendar] = React.useState(false);

      React.useEffect(() => {
        loadData();
      }, []);

      async function loadData() {
        if (!db) {
          alert('Firebase not configured. Please add your Firebase config.');
          setLoading(false);
          return;
        }

        try {
          // Load band info
          const bandDoc = await db.collection('config').doc('bandInfo').get();
          if (bandDoc.exists) {
            setBandInfo(bandDoc.data());
          } else {
            setShowBandSetup(true);
          }

          // Load venues with real-time updates
          db.collection('venues').onSnapshot(snapshot => {
            const venuesData = snapshot.docs.map(doc => ({
              id: doc.id,
              ...doc.data()
            }));
            setVenues(venuesData);
          });
        } catch (error) {
          console.error('Error loading data:', error);
          setShowBandSetup(true);
        }
        setLoading(false);
      }

      async function saveBandInfo(info) {
        if (!db) return;
        try {
          await db.collection('config').doc('bandInfo').set(info);
          setBandInfo(info);
          setShowBandSetup(false);
        } catch (error) {
          console.error('Error saving band info:', error);
          alert('Error saving band info');
        }
      }

      async function loadSampleVenues() {
        if (!db) return;
        try {
          const batch = db.batch();
          SAMPLE_VENUES.forEach(venue => {
            const docRef = db.collection('venues').doc();
            batch.set(docRef, venue);
          });
          await batch.commit();
        } catch (error) {
          console.error('Error loading sample venues:', error);
          alert('Error loading sample venues');
        }
      }

      async function autoAssignRegions() {
        if (!db) return;
        if (!confirm('Auto-assign regions to all venues based on their city? This will update all venues.')) return;
        
        try {
          const batch = db.batch();
          let updateCount = 0;
          
          venues.forEach(venue => {
            if (!venue.region && venue.city) {
              const region = getRegionForCity(venue.city);
              if (region) {
                const docRef = db.collection('venues').doc(venue.id);
                batch.update(docRef, { region: region });
                updateCount++;
              }
            }
          });
          
          if (updateCount > 0) {
            await batch.commit();
            alert(`Updated ${updateCount} venues with regions!`);
          } else {
            alert('All venues already have regions assigned!');
          }
        } catch (error) {
          console.error('Error auto-assigning regions:', error);
          alert('Error auto-assigning regions');
        }
      }

      async function addVenue(venue) {
        if (!db) return;
        try {
          const region = getRegionForCity(venue.city);
          await db.collection('venues').add({
            ...venue,
            region: region,
            status: 'Not Contacted',
            lastContacted: null,
            emailHistory: []
          });
          setShowVenueForm(false);
          setEditingVenue(null);
        } catch (error) {
          console.error('Error adding venue:', error);

      async function logEmail(venueId, emailType, emailContent) {
        if (!db) return;
        try {
          const venue = venues.find(v => v.id === venueId);
          const emailHistory = venue.emailHistory || [];
          emailHistory.push({
            date: new Date().toISOString(),
            type: emailType,
            content: emailContent
          });
          
          await db.collection('venues').doc(venueId).update({
            emailHistory,
            lastContacted: new Date().toISOString(),
            status: venue.status === 'Not Contacted' ? 'Waiting' : venue.status
          });
        } catch (error) {
          console.error('Error logging email:', error);
        }
      }

      function downloadCSV() {
        const headers = [
          'Venue Name', 'City', 'State', 'Played Before?', 'Phone Number',
          'Email Address', 'Category', 'Notes / Last Called', 'Most Recent Booking',
          'Address', 'Website/Social'
        ];

        const rows = venues.map(v => [
          v.name || '', v.city || '', v.state || '',
          v.playedBefore ? 'Yes' : '', v.phone || '', v.email || '',
          v.category || '', v.notes || '', v.mostRecentlyPlayed || '',
          v.address || '', v.website || ''
        ]);

        const csvContent = [
          headers.join('\t'),
          ...rows.map(row => row.join('\t'))
        ].join('\n');

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.setAttribute('href', url);
        link.setAttribute('download', `venues_${new Date().toISOString().split('T')[0]}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }

      const filteredVenues = venues.filter(v => {
        const matchesSearch = v.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                            v.city.toLowerCase().includes(searchTerm.toLowerCase());
        const matchesFilter = filterStatus === 'All' || v.status === filterStatus;
        const matchesRegion = filterRegion === 'All' || v.region === filterRegion;
        return matchesSearch && matchesFilter && matchesRegion;
      }).sort((a, b) => {
        // If Booked filter is active, sort by booking date (soonest first)
        if (filterStatus === 'Booked') {
          let dateA, dateB;
          if (a.confirmedBookingDate) {
            const [yearA, monthA, dayA] = a.confirmedBookingDate.split('-');
            dateA = new Date(yearA, monthA - 1, dayA);
          } else {
            dateA = new Date('9999-12-31');
          }
          if (b.confirmedBookingDate) {
            const [yearB, monthB, dayB] = b.confirmedBookingDate.split('-');
            dateB = new Date(yearB, monthB - 1, dayB);
          } else {
            dateB = new Date('9999-12-31');
          }
          return dateA - dateB;
        }
        
        // Otherwise, sort by state → city → venue name
        const stateCompare = (a.state || '').localeCompare(b.state || '');
        if (stateCompare !== 0) return stateCompare;
        
        const cityCompare = (a.city || '').localeCompare(b.city || '');
        if (cityCompare !== 0) return cityCompare;
        
        return (a.name || '').localeCompare(b.name || '');
      });

    function EmailGenerator({ venue, bandInfo, onClose, onSend }) {
      const [emailType, setEmailType] = React.useState('First Contact');
      const [gigDate, setGigDate] = React.useState('');
      const [specialDetails, setSpecialDetails] = React.useState('');
      const [generatedEmail, setGeneratedEmail] = React.useState('');
      const [copied, setCopied] = React.useState(false);

      React.useEffect(() => {
        generateEmail();
      }, [emailType, gigDate, specialDetails]);

      function generateEmail() {
        let email = '';
        
        let formattedDate = '';
        if (gigDate) {
          const [year, month, day] = gigDate.split('-');
          const date = new Date(year, month - 1, day);
          formattedDate = date.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }
        
        if (emailType === 'First Contact') {
          email = `Subject: ${bandInfo.bandName} - Booking Inquiry

Hi there,

My name is ${bandInfo.bandleaderName} and I'm the bandleader for ${bandInfo.bandName}.${bandInfo.bio ? ' ' + bandInfo.bio : ''}
We'd love to perform at ${venue.name}${gigDate ? ` on ${formattedDate}` : ''}. ${specialDetails}

Would you have any availability for us? We're flexible on dates and always put on a great show.

Looking forward to hearing from you!

Best regards,
${bandInfo.bandleaderName}
${bandInfo.bandName}${bandInfo.promoLinks ? '\n\n' + bandInfo.promoLinks : ''}`;
        } else if (emailType === 'Follow Up') {
          email = `Subject: Following Up - ${bandInfo.bandName}

Hi there,

I wanted to follow up on my previous email about ${bandInfo.bandName} performing at ${venue.name}${gigDate ? ` on ${formattedDate}` : ''}.

${specialDetails || 'We\'re still very interested in playing your venue and would love to discuss available dates.'}

Please let me know if you have any questions or would like to hear our music.

Thanks,
${bandInfo.bandleaderName}
${bandInfo.bandName}${bandInfo.promoLinks ? '\n\n' + bandInfo.promoLinks : ''}`;
        } else {
          // Use gigDate if provided, otherwise fall back to venue's confirmed booking date
          let confirmDate = gigDate;
          let confirmFormattedDate = formattedDate;
          
          if (!confirmDate && venue.confirmedBookingDate) {
            confirmDate = venue.confirmedBookingDate;
            const [year, month, day] = venue.confirmedBookingDate.split('-');
            const date = new Date(year, month - 1, day);
            confirmFormattedDate = date.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
          }
          
          email = `Subject: Confirming ${bandInfo.bandName} Performance

Hi there,

I wanted to confirm our upcoming performance at ${venue.name}${confirmDate ? ` on ${confirmFormattedDate}` : ''}.

${specialDetails || 'Please let me know if you need any additional information from us.'}

Looking forward to playing for you!

Best,
${bandInfo.bandleaderName}
${bandInfo.bandName}${bandInfo.promoLinks ? '\n\n' + bandInfo.promoLinks : ''}`;
        }
        
        setGeneratedEmail(email);
      }

      async function copyToClipboard() {
        try {
          await navigator.clipboard.writeText(generatedEmail);
          setCopied(true);
          await onSend(venue.id, emailType, generatedEmail);
          setTimeout(() => setCopied(false), 2000);
        } catch (error) {
          console.error('Copy failed:', error);
        }
      }

      function sendEmail() {
        const subjectMatch = generatedEmail.match(/^Subject: (.+)$/m);
        const subject = subjectMatch ? subjectMatch[1] : 'Booking Inquiry';
        
        const bodyStart = generatedEmail.indexOf('\n\n') + 2;
        const body = generatedEmail.substring(bodyStart);
        
        // Split into lines, encode each line separately, then join with line breaks
        const lines = body.split('\n');
        const encodedLines = lines.map(line => encodeURIComponent(line));
        const encodedBody = encodedLines.join('%0D%0A');
        
        const mailtoLink = `mailto:${venue.email}?subject=${encodeURIComponent(subject)}&body=${encodedBody}`;
        
        const link = document.createElement('a');
        link.href = mailtoLink;
        link.target = '_blank';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        onSend(venue.id, emailType, generatedEmail);
      }

            React.createElement('div', null,
              React.createElement('label', {
                className: 'block text-lg font-semibold text-gray-700 mb-2'
              }, 'Special Details (Optional)'),
              React.createElement('textarea', {
                value: specialDetails,
                onChange: (e) => setSpecialDetails(e.target.value),
                rows: 2,
                className: 'w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-lg focus:outline-none focus:border-purple-500',
                placeholder: 'Any special info to include...'
              })
            )
          ),

          // Generated Email
          React.createElement('div', {
            className: 'bg-gray-50 rounded-xl p-4 mb-4'
          },
            React.createElement('h3', {
              className: 'font-semibold text-gray-700 mb-2'
            }, 'Generated Email:'),
            React.createElement('textarea', {
              value: generatedEmail,
              onChange: (e) => setGeneratedEmail(e.target.value),
              rows: 15,
              className: 'w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm font-mono bg-white focus:outline-none focus:border-purple-500'
            })
          ),

          // Action Buttons
          React.createElement('div', {
            className: 'flex gap-3'
          },
            React.createElement('button', {
              onClick: copyToClipboard,
              className: 'flex-1 bg-gradient-to-r from-blue-500 to-indigo-500 text-white py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2'
            },
              copied 
                ? React.createElement(React.Fragment, null,
                    React.createElement(Icon, { name: 'Check', size: 24 }),
                    'Copied!'
                  )
                : React.createElement(React.Fragment, null,
                    React.createElement(Icon, { name: 'Copy', size: 24 }),
                    'Copy'
                  )
            ),
            React.createElement('button', {
              onClick: sendEmail,
              className: 'flex-1 bg-gradient-to-r from-green-500 to-emerald-500 text-white py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2'
            },
              React.createElement(Icon, { name: 'Mail', size: 24 }),
              'Send Email'
            )
          )
        )
      );
    }

    // ============================================
    // BULK IMPORT COMPONENT
    // ============================================
    function BulkImport({ onImport, onCancel }) {
      const [pastedData, setPastedData] = React.useState('');
      const [preview, setPreview] = React.useState([]);

      function parseData() {
        const lines = pastedData.trim().split('\n');
        const venues = [];
        
        lines.forEach((line, idx) => {
          if (idx === 0) return; // Skip header
          const parts = line.split('\t');
          if (parts.length >= 2 && parts[0] && parts[1]) {
            const city = parts[1] || '';
            const region = getRegionForCity(city);
            venues.push({
              name: parts[0] || '',
              city: city,
              state: parts[2] || '',
              playedBefore: parts[3]?.toLowerCase() === 'yes' || parts[3]?.toLowerCase() === 'true',
              phone: parts[4] || '',
              email: parts[5] || '',
              category: parts[6] || '',
              notes: parts[7] || '',
              mostRecentlyPlayed: parts[8] || null,
              address: parts[9] || '',
              website: parts[10] || '',
              region: region,
              status: 'Not Contacted',
              lastContacted: null,
              emailHistory: []
            });
          }
        });
        
        setPreview(venues);
      }

      return React.createElement('div', {
        className: 'min-h-screen p-4'
      },
        React.createElement('div', {
          className: 'bg-white rounded-2xl shadow-xl p-6 max-w-4xl mx-auto'
        },
          React.createElement('div', {
            className: 'flex items-center justify-between mb-6'
          },
            React.createElement('h2', {
              className: 'text-2xl font-bold text-gray-900'
            }, 'Bulk Import Venues'),
            React.createElement('button', {
              onClick: onCancel,
              className: 'p-2 hover:bg-gray-100 rounded-lg'
            }, React.createElement(Icon, { name: 'X', size: 24 }))
          ),

          React.createElement('div', {
            className: 'mb-6'
          },
            React.createElement('p', {
              className: 'text-gray-600 mb-4'
            }, 'Paste your tab-separated data from Excel. Expected columns: Venue Name, City, State, Played Before?, Phone, Email, Category, Notes, Most Recent Booking, Address, Website'),
            React.createElement('textarea', {
              value: pastedData,
              onChange: (e) => setPastedData(e.target.value),
              rows: 10,
              className: 'w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm font-mono focus:outline-none focus:border-purple-500',
              placeholder: 'Paste your Excel data here (include header row)...'
            })
          ),

          React.createElement('div', {
            className: 'flex gap-3 mb-6'
          },
            React.createElement('button', {
              onClick: parseData,
              className: 'flex-1 bg-blue-500 text-white py-3 rounded-xl font-bold text-lg'
            }, 'Preview Import')
          ),

          preview.length > 0 && React.createElement(React.Fragment, null,
            React.createElement('div', {
              className: 'bg-green-50 border-2 border-green-200 rounded-xl p-4 mb-4'
            },
              React.createElement('p', {
                className: 'text-green-800 font-semibold'
              }, '✓ Found ' + preview.length + ' venues to import')
            ),

            React.createElement('div', {
              className: 'max-h-96 overflow-y-auto mb-6 space-y-2'
            },
              preview.slice(0, 10).map((venue, idx) =>
                React.createElement('div', {
                  key: idx,
                  className: 'bg-gray-50 p-3 rounded-lg'
                },
                  React.createElement('p', {
                    className: 'font-semibold'
                  }, venue.name),
                  React.createElement('p', {
                    className: 'text-sm text-gray-600'
                  }, venue.city + ', ' + venue.state)
                )
              ),
              preview.length > 10 && React.createElement('p', {
                className: 'text-center text-gray-500'
              }, '...and ' + (preview.length - 10) + ' more')
            ),

            React.createElement('button', {
              onClick: () => onImport(preview),
              className: 'w-full bg-gradient-to-r from-green-500 to-emerald-500 text-white py-4 rounded-xl font-bold text-lg'
            }, 'Import ' + preview.length + ' Venues')
          )
        )
      );
    }

    // ============================================
    // RENDER APP
    // ============================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
