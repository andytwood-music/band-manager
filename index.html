    // Auto-migrate past bookings to playHistory
    function migrateOldBookingsToPlayHistory(venue) {
      if (!venue.bookings || venue.bookings.length === 0) {
        return venue;
      }

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const futureBookings = [];
      const pastBookings = venue.playHistory || [];

      venue.bookings.forEach(booking => {
        const bookingDate = new Date(booking.date + 'T00:00:00');
        if (bookingDate < today) {
          // Move to play history
          pastBookings.push({
            date: booking.date,
            showtime: booking.showtime || '',
            notes: booking.notes || '',
            status: booking.status || 'Confirmed'
          });
        } else {
          futureBookings.push(booking);
        }
      });

      // Sort play history by date (most recent first)
      pastBookings.sort((a, b) => new Date(b.date) - new Date(a.date));

      // Update mostRecentlyPlayed to most recent in playHistory
      const mostRecent = pastBookings.length > 0 ? pastBookings[0].date : venue.mostRecentlyPlayed;

      // Update status to 'Played' if there are no future bookings and we have play history
      const newStatus = futureBookings.length === 0 && pastBookings.length > 0 ? 'Played' : venue.status;

      return {
        ...venue,
        bookings: futureBookings,
        playHistory: pastBookings,
        mostRecentlyPlayed: mostRecent,
        status: newStatus
      };
    }

    // Add show to play history
    function addToPlayHistory(venue, booking) {
      const playHistory = venue.playHistory || [];
      playHistory.unshift({
        date: booking.date,
        showtime: booking.showtime || '',
        notes: booking.notes || '',
        status: booking.status || 'Confirmed'
      });

      return {
        ...venue,
        playHistory,
        mostRecentlyPlayed: booking.date
      };
    }

    // Format date for display
    function formatDate(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr + 'T00:00:00');
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    // Get days until booking
    function getDaysUntilBooking(dateStr) {
      if (!dateStr) return null;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const bookingDate = new Date(dateStr + 'T00:00:00');
      const diffTime = bookingDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      return diffDays;
    }

    // Get booking window status
    function getBookingWindowStatus(dateStr, bookingWindow) {
      const daysUntil = getDaysUntilBooking(dateStr);
      if (daysUntil === null) return null;
      
      const window = parseInt(bookingWindow) || 90;
      
      if (daysUntil < 0) return 'past';
      if (daysUntil === 0) return 'today';
      if (daysUntil <= 7) return 'this-week';
      if (daysUntil <= window) return 'within-window';
      return 'future';
    }

    function VenueList({ venues, onEdit, onDelete, onUpdate, selectedVenues, onSelectVenue, bookingWindow }) {
      const [sortConfig, setSortConfig] = useState({ key: null, direction: 'asc' });
      const [expandedVenues, setExpandedVenues] = useState(new Set());

      const sortedVenues = useMemo(() => {
        if (!sortConfig.key) return venues;

        return [...venues].sort((a, b) => {
          let aVal = a[sortConfig.key];
          let bVal = b[sortConfig.key];

          // Handle special cases
          if (sortConfig.key === 'nextBooking') {
            aVal = a.bookings?.[0]?.date || '';
            bVal = b.bookings?.[0]?.date || '';
          }

          if (aVal == null) aVal = '';
          if (bVal == null) bVal = '';

          if (aVal < bVal) return sortConfig.direction === 'asc' ? -1 : 1;
          if (aVal > bVal) return sortConfig.direction === 'asc' ? 1 : -1;
          return 0;
        });
      }, [venues, sortConfig]);

      const handleSort = (key) => {
        setSortConfig(prev => ({
          key,
          direction: prev.key === key && prev.direction === 'asc' ? 'desc' : 'asc'
        }));
      };

      const toggleExpanded = (venueId) => {
        setExpandedVenues(prev => {
          const next = new Set(prev);
          if (next.has(venueId)) {
            next.delete(venueId);
          } else {
            next.add(venueId);
          }
          return next;
        });
      };

      const getStatusColor = (status) => {
        const colors = {
          'Not Contacted': 'bg-gray-500',
          'Email Sent': 'bg-blue-500',
          'Follow Up': 'bg-yellow-500',
          'Booked': 'bg-green-500',
          'Played': 'bg-purple-500',
          'Pass': 'bg-red-500',
          'Priority': 'bg-orange-500',
          'Tentative': 'bg-amber-500'
        };
        return colors[status] || 'bg-gray-500';
      };

      if (venues.length === 0) {
        return React.createElement('div', { className: 'bg-white rounded-lg shadow-lg p-12 text-center' },
          React.createElement('p', { className: 'text-gray-500 text-lg' }, 'No venues found. Add your first venue to get started!')
        );
      }

      return React.createElement('div', { className: 'bg-white rounded-lg shadow-lg overflow-hidden' },
        React.createElement('div', { className: 'overflow-x-auto' },
          React.createElement('table', { className: 'w-full' },
            React.createElement('thead', { className: 'bg-gray-50 border-b border-gray-200' },
              React.createElement('tr', null,
                React.createElement('th', { className: 'px-4 py-3 text-left w-8' },
                  React.createElement('input', {
                    type: 'checkbox',
                    checked: venues.length > 0 && selectedVenues.length === venues.length,
                    onChange: (e) => {
                      if (e.target.checked) {
                        onSelectVenue('all');
                      } else {
                        venues.forEach(v => onSelectVenue(v.id));
                      }
                    },
                    className: 'w-4 h-4 text-purple-600 rounded focus:ring-purple-500'
                  })
                ),
                ['name', 'city', 'status', 'nextBooking', 'region'].map(key =>
                  React.createElement('th', {
                    key: key,
                    onClick: () => handleSort(key),
                    className: 'px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100'
                  },
                    React.createElement('div', { className: 'flex items-center gap-1' },
                      key === 'nextBooking' ? 'Next Show' : key.charAt(0).toUpperCase() + key.slice(1),
                      sortConfig.key === key && React.createElement('span', null, sortConfig.direction === 'asc' ? '↑' : '↓')
                    )
                  )
                ),
                React.createElement('th', { className: 'px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider' }, 'Actions')
              )
            ),
            React.createElement('tbody', { className: 'divide-y divide-gray-200' },
              sortedVenues.map(venue => {
                const nextBooking = venue.bookings?.[0];

    // ============================================
    // VENUE MAP COMPONENT
    // ============================================
    function VenueMap({ venues, onEdit, bookingWindow }) {
      const mapRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const markersRef = useRef([]);
      const infoWindowRef = useRef(null);
      const [visibleStatuses, setVisibleStatuses] = useState({
        'Not Contacted': true,
        'Email Sent': true,
        'Follow Up': true,
        'Booked': true,
        'Played': true,
        'Pass': false,
        'Priority': true,
        'Tentative': true
      });

      useEffect(() => {
        if (!mapRef.current || !window.google) return;

        // Initialize map
        const map = new window.google.maps.Map(mapRef.current, {
          center: { lat: 34.0522, lng: -118.2437 },
          zoom: 7,
          mapTypeControl: true,
          streetViewControl: false,
          fullscreenControl: true
        });

        mapInstanceRef.current = map;
        infoWindowRef.current = new window.google.maps.InfoWindow();

        return () => {
          markersRef.current.forEach(marker => marker.setMap(null));
          markersRef.current = [];
        };
      }, []);

      useEffect(() => {
        if (!mapInstanceRef.current) return;

        // Clear existing markers
        markersRef.current.forEach(marker => marker.setMap(null));
        markersRef.current = [];

        // Filter venues
        const visibleVenues = venues.filter(v => visibleStatuses[v.status]);

        // Add new markers
        visibleVenues.forEach(venue => {
          if (!venue.lat || !venue.lng) return;

          const getMarkerColor = (status) => {
            const colors = {
              'Not Contacted': '#6B7280',
              'Email Sent': '#3B82F6',
              'Follow Up': '#EAB308',
              'Booked': '#10B981',
              'Played': '#8B5CF6',
              'Pass': '#EF4444',
              'Priority': '#F97316',
              'Tentative': '#F59E0B'
            };
            return colors[status] || '#6B7280';
          };

          const marker = new window.google.maps.Marker({
            position: { lat: venue.lat, lng: venue.lng },
            map: mapInstanceRef.current,
            title: venue.name,
            icon: {
              path: window.google.maps.SymbolPath.CIRCLE,
              scale: 8,
              fillColor: getMarkerColor(venue.status),
              fillOpacity: 1,
              strokeColor: '#ffffff',
              strokeWeight: 2
            }
          });

          marker.addListener('click', () => {
            const bookings = venue.bookings || [];
            const upcomingBookings = bookings.slice(0, 3);
            
            const bookingsHTML = upcomingBookings.length > 0 
              ? upcomingBookings.map(b => {
                  const windowStatus = getBookingWindowStatus(b.date, bookingWindow);
                  const alertIcon = windowStatus === 'within-window' ? '🔔 ' : '';
                  return `<div class="text-sm">
                    ${alertIcon}${formatDate(b.date)}${b.showtime ? ' - ' + b.showtime : ''} (${b.status})
                  </div>`;
                }).join('')
              : '<div class="text-sm text-gray-500">No upcoming bookings</div>';

            const content = `
              <div style="max-width: 300px;">
                <h3 class="font-bold text-lg mb-2">${venue.name}</h3>
                <div class="space-y-1 mb-3">
                  <div class="text-sm">${venue.city}, ${venue.state}</div>
                  ${venue.phone ? `<div class="text-sm">${venue.phone}</div>` : ''}
                  ${venue.email ? `<div class="text-sm"><a href="mailto:${venue.email}" class="text-purple-600">${venue.email}</a></div>` : ''}
                </div>
                <div class="mb-2">
                  <span class="inline-block px-2 py-1 text-xs font-semibold rounded-full text-white" style="background-color: ${getMarkerColor(venue.status)}">${venue.status}</span>
                </div>
                ${upcomingBookings.length > 0 ? `
                  <div class="border-t pt-2 mt-2">
                    <div class="font-semibold text-sm mb-1">Upcoming Shows:</div>
                    ${bookingsHTML}
                    ${bookings.length > 3 ? `<div class="text-xs text-gray-500 mt-1">+ ${bookings.length - 3} more</div>` : ''}
                  </div>
                ` : ''}
                ${venue.notes ? `<div class="text-sm text-gray-600 mt-2">${venue.notes}</div>` : ''}
              </div>
            `;

            infoWindowRef.current.setContent(content);
            infoWindowRef.current.open(mapInstanceRef.current, marker);
          });

          markersRef.current.push(marker);
        });

        // Fit bounds to markers
        if (markersRef.current.length > 0) {
          const bounds = new window.google.maps.LatLngBounds();
          markersRef.current.forEach(marker => bounds.extend(marker.getPosition()));
          mapInstanceRef.current.fitBounds(bounds);
        }
      }, [venues, visibleStatuses, bookingWindow]);

      return React.createElement('div', { className: 'bg-white rounded-lg shadow-lg overflow-hidden' },
        React.createElement('div', { className: 'p-4 border-b bg-gray-50' },
          React.createElement('h3', { className: 'font-semibold mb-3' }, 'Filter by Status'),
          React.createElement('div', { className: 'flex flex-wrap gap-2' },
            Object.keys(visibleStatuses).map(status =>
              React.createElement('label', {
                key: status,
                className: 'inline-flex items-center gap-2 cursor-pointer'
              },
                React.createElement('input', {
                  type: 'checkbox',
                  checked: visibleStatuses[status],
                  onChange: (e) => setVisibleStatuses({
                    ...visibleStatuses,
                    [status]: e.target.checked
                  }),
                  className: 'w-4 h-4 text-purple-600 rounded focus:ring-purple-500'
                }),
                React.createElement('span', { className: 'text-sm' }, status)
              )
            )
          )
        ),
        React.createElement('div', {
          ref: mapRef,
          className: 'map-container',
          style: { height: '600px' }
        })
      );
    }

    // ============================================
    // VENUE CALENDAR COMPONENT
    // ============================================
    function VenueCalendar({ venues, onEdit, bookingWindow }) {
      const [currentDate, setCurrentDate] = useState(new Date());
      const [selectedBooking, setSelectedBooking] = useState(null);

      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'];

      const getDaysInMonth = (date) => {
        const year = date.getFullYear();
        const month = date.getMonth();
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const daysInMonth = lastDay.getDate();
        const startingDayOfWeek = firstDay.getDay();

        const days = [];
        
        // Add empty cells for days before month starts
        for (let i = 0; i < startingDayOfWeek; i++) {
          days.push(null);
        }
        
        // Add all days in month
        for (let day = 1; day <= daysInMonth; day++) {
          days.push(day);
        }
        
        return days;
      };

      const getBookingsForDate = (day) => {
        if (!day) return [];
        
        const dateStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        
        const bookings = [];
        
        // Get future bookings
        venues.forEach(venue => {
          if (venue.bookings) {
            venue.bookings.forEach(booking => {
              if (booking.date === dateStr) {
                bookings.push({
                  ...booking,
                  venue,
                  isPast: false
                });
              }
            });
          }
        });

        // Get past shows
        venues.forEach(venue => {
          if (venue.playHistory) {
            venue.playHistory.forEach(show => {
              if (show.date === dateStr) {
                bookings.push({
                  ...show,
                  venue,
                  isPast: true
                });
              }
            });
          }
        });
        
        return bookings;
      };

      const addToGoogleCalendar = (booking, e) => {
        e.stopPropagation();
        
        const venue = booking.venue;
        const title = `Warsaw Poland Bros @ ${venue.name}`;
        const location = venue.address || `${venue.city}, ${venue.state}`;
        
        // Format dates for Google Calendar
        let startDate, endDate;
        if (booking.showtime) {
          // Parse showtime (e.g., "8:00 PM" or "20:00")
          const timeParts = booking.showtime.match(/(\d+):(\d+)\s*(AM|PM)?/i);
          if (timeParts) {
            let hours = parseInt(timeParts[1]);
            const minutes = timeParts[2];
            const isPM = timeParts[3]?.toUpperCase() === 'PM';
            
            if (isPM && hours !== 12) hours += 12;
            if (!isPM && hours === 12) hours = 0;
            
            const showDate = new Date(booking.date + 'T00:00:00');
            showDate.setHours(hours, parseInt(minutes), 0);
            
            // Format as YYYYMMDDTHHmmss
            const formatDateTime = (d) => {
              return d.getFullYear() +
                String(d.getMonth() + 1).padStart(2, '0') +
                String(d.getDate()).padStart(2, '0') +
                'T' +
                String(d.getHours()).padStart(2, '0') +
                String(d.getMinutes()).padStart(2, '0') +
                '00';
            };
            
            startDate = formatDateTime(showDate);
            const endShowDate = new Date(showDate.getTime() + 3 * 60 * 60 * 1000); // 3 hour show
            endDate = formatDateTime(endShowDate);
          } else {
            // All-day event if time parsing fails
            startDate = booking.date.replace(/-/g, '');
            endDate = booking.date.replace(/-/g, '');
          }
        } else {
          // All-day event
          startDate = booking.date.replace(/-/g, '');
          endDate = booking.date.replace(/-/g, '');
        }
        
        // Build description
        const descriptionParts = [];
        if (venue.phone) descriptionParts.push(`Phone: ${venue.phone}`);
        if (venue.email) descriptionParts.push(`Email: ${venue.email}`);
        if (venue.website) descriptionParts.push(`Website: ${venue.website}`);
        if (booking.notes) descriptionParts.push(`Notes: ${booking.notes}`);
        if (venue.notes) descriptionParts.push(`Venue Notes: ${venue.notes}`);
        const description = descriptionParts.join('\\n');
        
        // Build Google Calendar URL
        const params = new URLSearchParams({
          action: 'TEMPLATE',
          text: title,
          dates: `${startDate}/${endDate}`,
          details: description,
          location: location
        });
        
        const url = `https://calendar.google.com/calendar/render?${params.toString()}`;
        window.open(url, '_blank');
      };

      const isToday = (day) => {
        const today = new Date();
        return day && 
          day === today.getDate() &&
          currentDate.getMonth() === today.getMonth() &&
          currentDate.getFullYear() === today.getFullYear();
      };

      const previousMonth = () => {
        setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1));
      };

      const nextMonth = () => {
        setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1));
      };

      const days = getDaysInMonth(currentDate);

      return React.createElement('div', { className: 'bg-white rounded-lg shadow-lg p-6' },
        // Calendar Header
        React.createElement('div', { className: 'flex items-center justify-between mb-6' },
          React.createElement('button', {
            onClick: previousMonth,
            className: 'p-2 hover:bg-gray-100 rounded-lg transition-colors'
          }, React.createElement(Icon, { name: 'ChevronLeft', size: 24 })),
          React.createElement('h2', { className: 'text-2xl font-bold' },
            `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`
          ),
          React.createElement('button', {
            onClick: nextMonth,
            className: 'p-2 hover:bg-gray-100 rounded-lg transition-colors'
          }, React.createElement(Icon, { name: 'ChevronRight', size: 24 }))
        ),

        // Calendar Grid
        React.createElement('div', { className: 'grid grid-cols-7 gap-2' },
          // Day headers
          ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day =>
            React.createElement('div', {
              key: day,
              className: 'text-center font-semibold text-gray-600 py-2'
            }, day)
          ),

          // Calendar days
          days.map((day, index) =>
            React.createElement('div', {
              key: index,
              className: `min-h-24 p-2 border rounded-lg ${
                !day ? 'bg-gray-50' : isToday(day) ? 'bg-purple-50 border-purple-300' : 'bg-white hover:bg-gray-50'
              }`
            },
              day && React.createElement('div', null,
                React.createElement('div', { className: 'font-semibold text-gray-700 mb-1' }, day),
                getBookingsForDate(day).map((booking, idx) => {
                  const windowStatus = !booking.isPast ? getBookingWindowStatus(booking.date, bookingWindow) : 'past';
                  const bgColor = booking.isPast 
                    ? 'bg-gray-400' 
                    : booking.status === 'Tentative' 
                      ? 'bg-amber-500' 
                      : 'bg-green-500';
                  
                  return React.createElement('div', {
                    key: idx,
                    className: `text-xs ${bgColor} text-white px-2 py-1 rounded mb-1 cursor-pointer hover:opacity-80 relative group`,
                    onClick: () => setSelectedBooking(booking)
                  },
                    React.createElement('div', { className: 'flex items-center justify-between gap-1' },
                      React.createElement('div', { className: 'flex-1 min-w-0' },
                        React.createElement('div', { className: 'font-medium truncate' }, booking.venue.name),
                        booking.showtime && React.createElement('div', { className: 'truncate' }, booking.showtime),
                        windowStatus === 'within-window' && !booking.isPast && React.createElement('div', null, '🔔')
                      ),
                      !booking.isPast && React.createElement('button', {
                        onClick: (e) => addToGoogleCalendar(booking, e),
                        className: 'flex-shrink-0 opacity-0 group-hover:opacity-100 transition-opacity text-lg',
                        title: 'Add to Google Calendar'
                      }, '📅')
                    )
                  );
                })
              )
            )
          )
        ),

        // Booking Detail Popup
        selectedBooking && React.createElement('div', {
          className: 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50',
          onClick: () => setSelectedBooking(null)
        },
          React.createElement('div', {
            className: 'bg-white rounded-lg shadow-xl max-w-md w-full p-6',
            onClick: (e) => e.stopPropagation()
          },
            React.createElement('h3', { className: 'text-xl font-bold mb-4' }, selectedBooking.venue.name),
            React.createElement('div', { className: 'space-y-2 mb-4' },
              React.createElement('div', { className: 'flex items-start gap-2' },
                React.createElement(Icon, { name: 'Calendar', size: 16, className: 'mt-1 text-gray-600' }),
                React.createElement('div', null,
                  React.createElement('div', { className: 'font-medium' }, formatDate(selectedBooking.date)),
                  selectedBooking.showtime && React.createElement('div', { className: 'text-sm text-gray-600' }, selectedBooking.showtime),
                  React.createElement('div', { className: 'text-sm' },
                    React.createElement('span', {
                      className: `inline-block px-2 py-1 rounded-full text-white text-xs ${
                        selectedBooking.isPast ? 'bg-gray-400' :
                        selectedBooking.status === 'Tentative' ? 'bg-amber-500' : 'bg-green-500'
                      }`
                    }, selectedBooking.isPast ? 'Played' : selectedBooking.status)
                  )
                )
              ),
              selectedBooking.venue.address && React.createElement('div', { className: 'flex items-start gap-2' },
                React.createElement(Icon, { name: 'MapPin', size: 16, className: 'mt-1 text-gray-600' }),
                React.createElement('div', { className: 'text-sm text-gray-700' }, selectedBooking.venue.address)
              ),
              selectedBooking.venue.phone && React.createElement('div', { className: 'flex items-center gap-2' },
                React.createElement(Icon, { name: 'Phone', size: 16, className: 'text-gray-600' }),
                React.createElement('div', { className: 'text-sm text-gray-700' }, selectedBooking.venue.phone)
              ),
              selectedBooking.venue.email && React.createElement('div', { className: 'flex items-center gap-2' },
                React.createElement(Icon, { name: 'Mail', size: 16, className: 'text-gray-600' }),
                React.createElement('a', {
                  href: `mailto:${selectedBooking.venue.email}`,
                  className: 'text-sm text-purple-600 hover:underline'
                }, selectedBooking.venue.email)
              ),
              selectedBooking.venue.website && React.createElement('div', { className: 'text-sm' },
                React.createElement('a', {
                  href: selectedBooking.venue.website,
                  target: '_blank',
                  rel: 'noopener noreferrer',
                  className: 'text-purple-600 hover:underline'
                }, 'Website →')
              ),
              (selectedBooking.notes || selectedBooking.venue.notes) && React.createElement('div', { className: 'pt-2 border-t' },
                React.createElement('div', { className: 'text-sm font-medium text-gray-700 mb-1' }, 'Notes:'),
                React.createElement('div', { className: 'text-sm text-gray-600 whitespace-pre-wrap' },
                  selectedBooking.notes || selectedBooking.venue.notes
                )
              )
            ),
            React.createElement('div', { className: 'flex gap-2' },
              !selectedBooking.isPast && React.createElement('button', {
                onClick: (e) => {
                  addToGoogleCalendar(selectedBooking, e);
                  setSelectedBooking(null);
                },
                className: 'flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center justify-center gap-2'
              },
                React.createElement('span', null, '📅'),
                React.createElement('span', null, 'Add to Google Calendar')
              ),
              React.createElement('button', {
                onClick: () => {
                  onEdit(selectedBooking.venue);
                  setSelectedBooking(null);
                },
                className: 'flex-1 px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 flex items-center justify-center gap-2'
              },
                React.createElement(Icon, { name: 'Edit', size: 16 }),
                React.createElement('span', null, 'Edit Venue')
              )
            ),
            React.createElement('button', {
              onClick: () => setSelectedBooking(null),
              className: 'w-full mt-2 px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200'
            }, 'Close')
          )
        )
      );
    }

    // ============================================
    // BULK IMPORT BUTTON
    // ============================================
    function BulkImportButton({ onImport }) {
      const fileInputRef = useRef(null);

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            if (file.name.endsWith('.json')) {
              const data = JSON.parse(event.target.result);
              onImport(Array.isArray(data) ? data : [data]);
            } else if (file.name.endsWith('.csv') || file.name.endsWith('.tsv')) {
              const delimiter = file.name.endsWith('.tsv') ? '\t' : ',';
              window.Papa.parse(event.target.result, {
                header: true,
                delimiter: delimiter,
                skipEmptyLines: true,
                complete: (results) => {
                  const venues = results.data.map(row => ({
                    name: row.name || row.Name || '',
                    city: row.city || row.City || '',
                    state: row.state || row.State || 'CA',
                    phone: row.phone || row.Phone || '',
                    email: row.email || row.Email || '',
                    address: row.address || row.Address || '',
                    notes: row.notes || row.Notes || '',
                    status: row.status || row.Status || 'Not Contacted',
                    category: row.category || row.Category || '',
                    website: row.website || row.Website || '',
                    region: row.region || row.Region || getRegionForCity(row.city || row.City || ''),
                    bookings: [],
                    playHistory: [],
                    mostRecentlyPlayed: row.mostRecentlyPlayed || row['Most Recently Played'] || null,
                    playedBefore: row.playedBefore === 'true' || row['Played Before'] === 'true',
                    lastContacted: row.lastContacted || row['Last Contacted'] || null,
                    emailHistory: []
                  }));
                  onImport(venues);
                }
              });
            }
          } catch (error) {
            console.error('Error parsing file:', error);
            alert('Error parsing file. Please check the format.');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      return React.createElement('div', null,
        React.createElement('input', {
          ref: fileInputRef,
          type: 'file',
          accept: '.json,.csv,.tsv',
          onChange: handleFileUpload,
          className: 'hidden'
        }),
        React.createElement('button', {
          onClick: () => fileInputRef.current?.click(),
          className: 'px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 flex items-center gap-2 transition-colors'
        },
          React.createElement(Icon, { name: 'Upload', size: 20 }),
          React.createElement('span', null, 'Import')
        )
      );
    }

    // ============================================
    // PHOTO UPLOAD BUTTON (OCR)
    // ============================================
    function PhotoUploadButton({ onVenueAdd }) {
      const [isProcessing, setIsProcessing] = useState(false);
      const fileInputRef = useRef(null);

      const handlePhotoUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setIsProcessing(true);

        try {
          const result = await Tesseract.recognize(file, 'eng');
          const text = result.data.text;

          // Try to extract venue info from OCR text
          const lines = text.split('\n').filter(line => line.trim());
          
          // Simple heuristic: first line is venue name
          const name = lines[0] || '';
          
          // Try to find address/city/state
          let city = '', state = '', address = '';
          const cityStatePattern = /([A-Za-z\s]+),\s*([A-Z]{2})/;
          
          for (let line of lines) {
            const match = line.match(cityStatePattern);
            if (match) {
              city = match[1].trim();
              state = match[2];
              address = line;
              break;
            }
          }

          const venue = {
            name,
            city,
            state: state || 'CA',
            address,
            phone: '',
            email: '',
            notes: `OCR from photo:\n${text}`,
            status: 'Not Contacted',
            category: '',
            website: '',
            region: getRegionForCity(city),
            bookings: [],
            playHistory: [],
            playedBefore: false,
            lastContacted: null,
            emailHistory: []
          };

          onVenueAdd(venue);
        } catch (error) {
          console.error('OCR Error:', error);
          alert('Error processing image. Please try again.');
        } finally {
          setIsProcessing(false);
          e.target.value = '';
        }
      };

      return React.createElement('div', null,
        React.createElement('input', {
          ref: fileInputRef,
          type: 'file',
          accept: 'image/*',
          onChange: handlePhotoUpload,
          className: 'hidden'
        }),
        React.createElement('button', {
          onClick: () => fileInputRef.current?.click(),
          disabled: isProcessing,
          className: `px-4 py-2 rounded-lg flex items-center gap-2 transition-colors ${
            isProcessing
              ? 'bg-gray-300 text-gray-500 cursor-not-allowed'
              : 'bg-indigo-600 text-white hover:bg-indigo-700'
          }`
        },
          React.createElement(Icon, { name: 'Upload', size: 20 }),
          React.createElement('span', null, isProcessing ? 'Processing...' : 'Photo Upload (OCR)')
        )
      );
    }
