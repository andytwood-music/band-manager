function App() {
  const [venues, setVenues] = React.useState([]);
  const [showVenueForm, setShowVenueForm] = React.useState(false);
  const [showBulkImport, setShowBulkImport] = React.useState(false);
  const [editingVenue, setEditingVenue] = React.useState(null);
  const [viewingVenue, setViewingVenue] = React.useState(null);
  const [emailVenue, setEmailVenue] = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const [searchTerm, setSearchTerm] = React.useState('');
  const [filterStatus, setFilterStatus] = React.useState('All');
  const [filterRegion, setFilterRegion] = React.useState('All');
  const [showCalendar, setShowCalendar] = React.useState(false);
  const [returnToCalendar, setReturnToCalendar] = React.useState(false);
  const [showAvails, setShowAvails] = React.useState(false);
  const [savedAvailableDates, setSavedAvailableDates] = React.useState('');
  const [showMap, setShowMap] = React.useState(false);
  const [showPhotoUpload, setShowPhotoUpload] = React.useState(false);

  React.useEffect(() => { loadData(); }, []);

  async function loadData() {
    if (!db) { alert('Firebase not configured.'); setLoading(false); return; }
    try {
      const availsDoc = await db.collection('config').doc('availableDates').get();
      if (availsDoc.exists) setSavedAvailableDates(availsDoc.data().dates || '');
      db.collection('venues').onSnapshot(snapshot => {
        setVenues(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        setLoading(false);
      });
    } catch (error) { console.error('Error loading data:', error); setLoading(false); }
  }

  async function saveAvailableDates(dates) {
    if (!db) return;
    try { await db.collection('config').doc('availableDates').set({ dates }); setSavedAvailableDates(dates); setShowAvails(false); }
    catch (e) { console.error('Error saving dates:', e); alert('Error saving available dates'); }
  }

  async function loadSampleVenues() {
    if (!db) return;
    try { const batch = db.batch(); SAMPLE_VENUES.forEach(v => { batch.set(db.collection('venues').doc(), v); }); await batch.commit(); }
    catch (e) { console.error('Error loading samples:', e); }
  }

  async function addVenue(venue) {
    if (!db) return;
    try {
      await db.collection('venues').add({ ...venue, region: venue.region || getRegionForCity(venue.city), status: venue.status || 'Not Contacted', lastContacted: venue.lastContacted || null, emailHistory: venue.emailHistory || [] });
      setShowVenueForm(false); setEditingVenue(null);
    } catch (e) { console.error('Error adding venue:', e); alert('Error adding venue'); }
  }

  async function updateVenue(id, updates) {
    if (!db) return;
    try { await db.collection('venues').doc(id).update(updates); setShowVenueForm(false); setEditingVenue(null); }
    catch (e) { console.error('Error updating venue:', e); alert('Error updating venue'); }
  }

  async function deleteVenue(id) {
    if (!confirm('Delete this venue?')) return;
    if (!db) return;
    try { await db.collection('venues').doc(id).delete(); } catch (e) { console.error('Error deleting:', e); }
  }

  async function logEmail(venueId, emailType, emailContent) {
    if (!db) return;
    try {
      const venue = venues.find(v => v.id === venueId);
      const emailHistory = [...(venue.emailHistory || []), { date: new Date().toISOString(), type: emailType, content: emailContent }];
      await db.collection('venues').doc(venueId).update({ emailHistory, lastContacted: new Date().toISOString(), status: venue.status === 'Not Contacted' ? 'Waiting' : venue.status });
    } catch (e) { console.error('Error logging email:', e); }
  }

  function downloadCSV() {
    const headers = ['Venue Name','City','State','Played Before?','Phone Number','Email Address','Category','Notes / Last Called','Most Recent Booking','Address','Website/Social'];
    const rows = venues.map(v => [v.name||'',v.city||'',v.state||'',v.playedBefore?'Yes':'',v.phone||'',v.email||'',v.category||'',v.notes||'',v.mostRecentlyPlayed||'',v.address||'',v.website||'']);
    const blob = new Blob([[headers.join('\t'), ...rows.map(r => r.join('\t'))].join('\n')], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `venues_${new Date().toISOString().split('T')[0]}.csv`; link.style.visibility = 'hidden'; document.body.appendChild(link); link.click(); document.body.removeChild(link);
  }

  async function autoFillMissingInfo() {
    if (!db) return;
    const venuesToFill = venues.filter(v => v.city && v.state && (!v.address || !v.phone || !v.website));
    if (venuesToFill.length === 0) { alert('All venues already have complete info!'); return; }
    if (!confirm(`Search Google Places for ${venuesToFill.length} venues?\n\nUses your API quota.`)) return;
    let processed = 0, updated = 0, failed = 0; const results = [];
    for (const venue of venuesToFill) {
      processed++;
      try {
        const resp = await fetch('https://places.googleapis.com/v1/places:searchText', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Goog-Api-Key': GOOGLE_MAPS_API_KEY, 'X-Goog-FieldMask': 'places.displayName,places.formattedAddress,places.nationalPhoneNumber,places.websiteUri,places.location' }, body: JSON.stringify({ textQuery: `${venue.name}, ${venue.city}, ${venue.state}` }) });
        const data = await resp.json();
        if (data.places && data.places[0]) {
          const p = data.places[0]; const u = {};
          if (!venue.address && p.formattedAddress) u.address = p.formattedAddress;
          if (!venue.phone && p.nationalPhoneNumber) u.phone = p.nationalPhoneNumber;
          if (!venue.website && p.websiteUri) u.website = p.websiteUri;
          if (p.location) { u.latitude = p.location.latitude; u.longitude = p.location.longitude; }
          if (Object.keys(u).length > 0) { await db.collection('venues').doc(venue.id).update(u); updated++; results.push(`✓ ${venue.name}: ${Object.keys(u).join(', ')}`); }
          else results.push(`- ${venue.name}: No missing info`);
        } else { failed++; results.push(`✗ ${venue.name}: Not found`); }
      } catch (e) { failed++; results.push(`✗ ${venue.name}: Error`); }
      await new Promise(r => setTimeout(r, 200));
    }
    alert(`Auto-fill complete!\nProcessed: ${processed}\nUpdated: ${updated}\nFailed: ${failed}`);
    results.forEach(r => console.log(r));
